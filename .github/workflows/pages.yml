# Publica o portfólio inteiro no GitHub Pages a cada push no main.
# O repo é 100% estático (sem build) — o artefato é a própria raiz.
#
# Habilitar uma vez em: Settings → Pages → Source: "GitHub Actions".
# Atenção: em repositório PRIVADO, Pages exige plano pago ou tornar o
# repositório público. A URL final fica em
#   https://<usuario>.github.io/WebSiteFolio/
# (todos os links do repo são relativos — funcionam em subpath).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193756"/>
      <stop offset="1" stop-color="#0E2336"/>
    </linearGradient>
    <linearGradient id="soak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C39A3B"/>
      <stop offset="1" stop-color="#96702A"/>
    </linearGradient>
    <pattern id="sgrain" width="44" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q11 2 22 5 T44 5" fill="none" stroke="#6E5017" stroke-width="0.9" opacity="0.45"/>
      <path d="M0 14 Q11 17 22 14 T44 14" fill="none" stroke="#E4C464" stroke-width="0.7" opacity="0.26"/>
    </pattern>
    <radialGradient id="sglow" cx="0.28" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#E7C86A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E7C86A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="540" fill="url(#sbg)"/>
  <rect width="720" height="540" fill="url(#sglow)"/>

  <!-- wall dado line -->
  <path d="M0 210 L720 60" stroke="#22415F" stroke-width="2" opacity="0.8"/>
  <path d="M0 238 L720 88" stroke="#22415F" stroke-width="1" opacity="0.5"/>

  <!-- window slit -->
  <rect x="96" y="88" width="58" height="96" fill="#16324F" stroke="#F4EFE4" stroke-width="2"/>
  <path d="M96 136h58M125 88v96" stroke="#3E5B78" stroke-width="1.4"/>

  <!-- floor -->
  <rect x="0" y="470" width="720" height="70" fill="#0A1B2C"/>

  <!-- steps: descending left, from top right -->
  <g>
    <g fill="url(#soak)" stroke="#5C4413" stroke-width="1.6">
      <path d="M580 150h140v44H580z"/>
      <path d="M508 194h212v44H508z"/>
      <path d="M436 238h284v44H436z"/>
      <path d="M364 282h356v44H364z"/>
      <path d="M292 326h428v44H292z"/>
      <path d="M220 370h500v44H220z"/>
      <path d="M148 414h572v56H148z"/>
    </g>
    <g fill="url(#sgrain)">
      <path d="M580 150h140v44H580z"/>
      <path d="M508 194h212v44H508z"/>
      <path d="M436 238h284v44H436z"/>
      <path d="M364 282h356v44H364z"/>
      <path d="M292 326h428v44H292z"/>
      <path d="M220 370h500v44H220z"/>
      <path d="M148 414h572v56H148z"/>
    </g>
    <!-- nosings -->
    <g stroke="#E4C464" stroke-width="2" opacity="0.85">
      <path d="M580 150h140M508 194h212M436 238h284M364 282h356M292 326h428M220 370h500M148 414h572"/>
    </g>
  </g>

  <!-- balusters -->
  <g stroke="#F4EFE4" stroke-width="3.4">
    <path d="M600 148V74M528 192v-74M456 236v-74M384 280v-74M312 324v-74M240 368v-74M168 412v-74"/>
  </g>
  <g stroke="#F4EFE4" stroke-width="1.4" opacity="0.6">
    <path d="M636 148V86M564 192v-62M492 236v-62M420 280v-62M348 324v-62M276 368v-62M204 412v-62"/>
  </g>

  <!-- handrail -->
  <path d="M138 336 Q150 330 168 326 L636 78 Q664 64 692 62" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
  <path d="M138 336 Q150 330 168 326 L636 78 Q664 64 692 62" fill="none" stroke="#E4C464" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

  <!-- newel post -->
  <rect x="126" y="336" width="26" height="134" fill="url(#soak)" stroke="#5C4413" stroke-width="1.6"/>
  <circle cx="139" cy="326" r="14" fill="#C9A227"/>
  <circle cx="134" cy="321" r="4.5" fill="#E4C464"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193756"/>
      <stop offset="1" stop-color="#0E2336"/>
    </linearGradient>
    <linearGradient id="doak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C39A3B"/>
      <stop offset="1" stop-color="#96702A"/>
    </linearGradient>
    <linearGradient id="doakD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87F2E"/>
      <stop offset="1" stop-color="#7E5D1E"/>
    </linearGradient>
    <pattern id="dgrain" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q12 2 24 6 T48 6" fill="none" stroke="#6E5017" stroke-width="1" opacity="0.5"/>
      <path d="M0 15 Q12 19 24 15 T48 15" fill="none" stroke="#6E5017" stroke-width="0.8" opacity="0.36"/>
      <path d="M0 23 Q12 20 24 23 T48 23" fill="none" stroke="#E4C464" stroke-width="0.8" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="720" height="540" fill="url(#dbg)"/>

  <!-- brick hint -->
  <g stroke="#22415F" stroke-width="1.4" opacity="0.7">
    <path d="M0 120h720M0 168h720M0 216h720M0 264h720M0 312h720M0 360h720M0 408h720M0 456h720"/>
    <path d="M80 120v48M240 120v48M560 120v48M160 168v48M640 168v48M80 216v48M600 264v48M120 312v48M620 360v48"/>

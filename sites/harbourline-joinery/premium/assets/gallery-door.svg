  <!-- step -->
  <rect x="180" y="486" width="360" height="16" fill="#0A1B2C"/>
  <rect x="196" y="472" width="328" height="14" fill="#1C3A52"/>

  <!-- surround -->
  <rect x="216" y="82" width="288" height="390" fill="#0F2740" stroke="#F4EFE4" stroke-width="3"/>
  <rect x="228" y="94" width="264" height="378" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.8"/>

  <!-- fanlight -->
  <path d="M244 178a116 78 0 0 1 232 0z" fill="#16324F" stroke="#C9A227" stroke-width="2"/>
  <g stroke="#E4C464" stroke-width="2.2" fill="none">
    <path d="M360 178V104M360 178l-62-52M360 178l62-52M360 178l-98-22M360 178l98-22"/>
  </g>
  <circle cx="360" cy="178" r="10" fill="#C9A227"/>

  <!-- leaf -->
  <rect x="252" y="192" width="216" height="280" fill="url(#doak)"/>
  <rect x="252" y="192" width="216" height="280" fill="url(#dgrain)"/>
  <rect x="252" y="192" width="216" height="280" fill="none" stroke="#5C4413" stroke-width="2.5"/>
  <g>
    <rect x="272" y="212" width="80" height="104" fill="url(#doakD)" stroke="#5C4413" stroke-width="1.5"/>
    <rect x="368" y="212" width="80" height="104" fill="url(#doakD)" stroke="#5C4413" stroke-width="1.5"/>
    <rect x="272" y="338" width="80" height="112" fill="url(#doakD)" stroke="#5C4413" stroke-width="1.5"/>
    <rect x="368" y="338" width="80" height="112" fill="url(#doakD)" stroke="#5C4413" stroke-width="1.5"/>
    <g fill="none" stroke="#E4C464" stroke-width="1" opacity="0.5">
      <rect x="280" y="220" width="64" height="88"/>
      <rect x="376" y="220" width="64" height="88"/>
      <rect x="280" y="346" width="64" height="96"/>
      <rect x="376" y="346" width="64" height="96"/>
    </g>
  </g>
  <circle cx="448" cy="330" r="7" fill="#E4C464"/>
  <circle cx="448" cy="330" r="2.6" fill="#7A620E"/>

  <!-- lantern -->
  <g stroke="#C9A227" stroke-width="2" fill="none">
    <path d="M560 96v26"/>
    <path d="M545 122h30l-5 34h-20z" fill="#16324F"/>
    <circle cx="560" cy="139" r="5" fill="#E4C464" stroke="none"/>

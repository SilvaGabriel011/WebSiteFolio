      <path d="M0 14 Q12 17 23 14 T46 14" fill="none" stroke="#E4C464" stroke-width="0.7" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="720" height="540" fill="url(#cbg)"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A5C"/>
      <stop offset="1" stop-color="#0E2336"/>
    </linearGradient>
    <linearGradient id="ppanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98B33"/>
      <stop offset="1" stop-color="#8C6824"/>
    </linearGradient>
    <linearGradient id="ptable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C39A3B"/>
      <stop offset="1" stop-color="#9A742A"/>
    </linearGradient>
    <pattern id="pgrain" width="42" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q10 1 21 4 T42 4" fill="none" stroke="#6E5017" stroke-width="0.8" opacity="0.4"/>
      <path d="M0 13 Q10 16 21 13 T42 13" fill="none" stroke="#E4C464" stroke-width="0.6" opacity="0.24"/>
    </pattern>
  </defs>

  <rect width="720" height="540" fill="url(#pbg)"/>

  <!-- linear pendant -->
  <path d="M240 0v56M480 0v56" stroke="#C9A227" stroke-width="2"/>
  <rect x="216" y="56" width="288" height="10" rx="5" fill="#C9A227"/>
  <rect x="228" y="66" width="264" height="4" fill="#E7C86A" opacity="0.5"/>

  <!-- panelled wall -->
  <g>
    <rect x="48" y="108" width="624" height="236" fill="#10283F"/>
    <!-- picture rail -->
    <path d="M48 108h624" stroke="#C9A227" stroke-width="4"/>
    <!-- fielded panels, two rows -->
    <g fill="url(#ppanel)" stroke="#5C4413" stroke-width="1.6">
      <rect x="68" y="128" width="136" height="92"/>
      <rect x="220" y="128" width="136" height="92"/>
      <rect x="372" y="128" width="136" height="92"/>
      <rect x="524" y="128" width="128" height="92"/>
      <rect x="68" y="236" width="136" height="88"/>
      <rect x="220" y="236" width="136" height="88"/>
      <rect x="372" y="236" width="136" height="88"/>
      <rect x="524" y="236" width="128" height="88"/>
    </g>
    <g fill="url(#pgrain)">
      <rect x="68" y="128" width="136" height="92"/>
      <rect x="220" y="128" width="136" height="92"/>
      <rect x="372" y="128" width="136" height="92"/>
      <rect x="524" y="128" width="128" height="92"/>
      <rect x="68" y="236" width="136" height="88"/>
      <rect x="220" y="236" width="136" height="88"/>
      <rect x="372" y="236" width="136" height="88"/>
      <rect x="524" y="236" width="128" height="88"/>
    </g>
    <g fill="none" stroke="#E4C464" stroke-width="1.1" opacity="0.55">
      <rect x="82" y="142" width="108" height="64"/>
      <rect x="234" y="142" width="108" height="64"/>
      <rect x="386" y="142" width="108" height="64"/>
      <rect x="538" y="142" width="100" height="64"/>
      <rect x="82" y="250" width="108" height="60"/>
      <rect x="234" y="250" width="108" height="60"/>
      <rect x="386" y="250" width="108" height="60"/>
      <rect x="538" y="250" width="100" height="60"/>
    </g>
    <!-- dado rail -->
    <path d="M48 344h624" stroke="#F4EFE4" stroke-width="3"/>
  </g>

  <!-- boardroom table -->
  <g>
    <ellipse cx="360" cy="470" rx="270" ry="16" fill="#0A1B2C"/>
    <rect x="130" y="408" width="460" height="20" rx="6" fill="url(#ptable)"/>
    <rect x="130" y="408" width="460" height="20" rx="6" fill="url(#pgrain)"/>
    <rect x="130" y="408" width="460" height="20" rx="6" fill="none" stroke="#5C4413" stroke-width="1.8"/>
    <path d="M170 428v40M550 428v40M360 428v40" stroke="#C9A227" stroke-width="5"/>
    <!-- chair backs -->
    <g fill="none" stroke="#F4EFE4" stroke-width="2.6" opacity="0.85">
      <path d="M216 404v-26a10 10 0 0 1 10-10h20a10 10 0 0 1 10 10v26"/>
      <path d="M336 404v-26a10 10 0 0 1 10-10h20a10 10 0 0 1 10 10v26"/>
      <path d="M456 404v-26a10 10 0 0 1 10-10h20a10 10 0 0 1 10 10v26"/>
    </g>
  </g>
</svg>

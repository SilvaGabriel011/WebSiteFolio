<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylised double-hung timber window with the lower sash raised and a pot plant on the sill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3C5F"/><stop offset="1" stop-color="#0F2438"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C96C"/><stop offset="1" stop-color="#A8861E"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C5580"/><stop offset="1" stop-color="#16324F"/>
    </linearGradient>
    <pattern id="grain" width="120" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 6q30-6 60 0t60 0" fill="none" stroke="#7A620E" stroke-opacity=".4" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#C9A227" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- weatherboard hint -->
  <g stroke="#F4EFE4" stroke-opacity=".08" stroke-width="10">
    <path d="M20 90h760M20 130h760M20 170h760M20 210h760M20 250h760M20 290h760M20 330h760M20 370h760M20 410h760M20 450h760"/>
  </g>

  <!-- outer frame -->
  <rect x="210" y="70" width="380" height="440" fill="url(#oak)"/>
  <rect x="210" y="70" width="380" height="440" fill="url(#grain)"/>
  <rect x="240" y="100" width="320" height="380" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="330" cy="180" r="34" fill="#F4EFE4" fill-opacity=".8"/>

  <!-- upper sash: 6 panes -->
  <g fill="none" stroke="#F4EFE4" stroke-width="8">
    <rect x="240" y="100" width="320" height="190"/>
    <path d="M346 100v190M453 100v190M240 195h320"/>
  </g>

  <!-- lower sash raised, overlapping -->
  <g>
    <rect x="228" y="252" width="344" height="180" fill="none" stroke="url(#oak)" stroke-width="20"/>
    <g fill="none" stroke="#F4EFE4" stroke-width="8">
      <path d="M344 262v160M456 262v160M238 342h324"/>
    </g>
    <!-- sash lift -->
    <rect x="376" y="440" width="48" height="10" rx="4" fill="#F4EFE4"/>
    <!-- sash horns -->
    <path d="M218 432v26l16-4v-22zM582 432v26l-16-4v-22z" fill="#C9A227"/>
  </g>

  <!-- sill + pot plant -->
  <rect x="190" y="504" width="420" height="22" rx="4" fill="url(#oak)"/>
  <rect x="190" y="504" width="420" height="22" rx="4" fill="url(#grain)"/>
  <g>
    <path d="M636 470h56l-8 56h-40z" fill="#C9A227"/>
    <g fill="none" stroke="#F4EFE4" stroke-opacity=".85" stroke-width="5" stroke-linecap="round">
      <path d="M664 468v-36"/>
      <path d="M664 446q-24-4-30-28 26 0 30 28z"/>
      <path d="M664 452q24-6 28-30-26 2-28 30z"/>
    </g>
  </g>
  <line x1="40" y1="540" x2="760" y2="540" stroke="#F4EFE4" stroke-opacity=".3" stroke-width="3"/>
</svg>

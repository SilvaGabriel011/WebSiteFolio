<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324F"/>
      <stop offset="1" stop-color="#0F2540"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4BC3F"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <pattern id="grain" width="70" height="20" patternUnits="userSpaceOnUse">
      <rect width="70" height="20" fill="#C9A227"/>
      <path d="M0 4q17-3 35 0t35 0" fill="none" stroke="#9A7B1B" stroke-width="1.1" opacity=".5"/>
      <path d="M0 10q14 4 35 1t35 1" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".4"/>
      <path d="M0 16q19-3 35 0t35-1" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="440" height="320" fill="url(#bg)"/>
  <!-- linear pendant -->
  <path d="M150 0v26M290 0v26" stroke="#F7F3E8" stroke-width="2.5"/>
  <rect x="120" y="26" width="200" height="8" rx="4" fill="url(#gold)"/>
  <!-- wall panelling: two tiers of raised panels -->
  <g>
    <rect x="28" y="56" width="384" height="88" fill="url(#grain)" opacity=".28"/>
    <g fill="none" stroke="url(#gold)" stroke-width="3.5">
      <rect x="40" y="66" width="80" height="68"/>
      <rect x="134" y="66" width="80" height="68"/>
      <rect x="228" y="66" width="80" height="68"/>
      <rect x="322" y="66" width="80" height="68"/>
    </g>
    <g fill="none" stroke="#F7F3E8" stroke-width="1.6" opacity=".55">
      <rect x="50" y="76" width="60" height="48"/>
      <rect x="144" y="76" width="60" height="48"/>
      <rect x="238" y="76" width="60" height="48"/>
      <rect x="332" y="76" width="60" height="48"/>
    </g>
  </g>
  <rect x="20" y="146" width="400" height="10" fill="#F7F3E8"/>
  <g>
    <rect x="28" y="160" width="384" height="64" fill="url(#grain)" opacity=".22"/>
    <g fill="none" stroke="url(#gold)" stroke-width="3">
      <rect x="40" y="168" width="174" height="48"/>
      <rect x="228" y="168" width="174" height="48"/>
    </g>
  </g>
  <rect x="20" y="226" width="400" height="8" fill="#9A7B1B"/>
  <!-- boardroom table + chairs -->
  <rect x="70" y="258" width="300" height="14" rx="4" fill="url(#grain)"/>
  <rect x="70" y="258" width="300" height="14" rx="4" fill="none" stroke="#0A1826" stroke-width="2.5"/>
  <path d="M96 272v34M344 272v34" stroke="#0D2135" stroke-width="10"/>
  <g fill="#0D2135" stroke="#C9A227" stroke-width="2.5">
    <rect x="34" y="244" width="26" height="52" rx="8"/>
    <rect x="380" y="244" width="26" height="52" rx="8"/>
  </g>
  <rect y="304" width="440" height="16" fill="#0A1826"/>
</svg>

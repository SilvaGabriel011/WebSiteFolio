<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4066"/>
      <stop offset="1" stop-color="#0F2540"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4BC3F"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#E4BC3F" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E4BC3F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grainv" width="20" height="70" patternUnits="userSpaceOnUse">
      <rect width="20" height="70" fill="#C9A227"/>
      <path d="M4 0q-3 17 0 35t0 35" fill="none" stroke="#9A7B1B" stroke-width="1.1" opacity=".55"/>
      <path d="M10 0q4 14 1 35t1 35" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".45"/>
      <path d="M16 0q-3 19 0 35t-1 35" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".5"/>
    </pattern>
    <pattern id="grainh" width="70" height="20" patternUnits="userSpaceOnUse">
      <rect width="70" height="20" fill="#E4BC3F"/>
      <path d="M0 4q17-3 35 0t35 0" fill="none" stroke="#9A7B1B" stroke-width="1.1" opacity=".6"/>
      <path d="M0 10q14 4 35 1t35 1" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".5"/>
      <path d="M0 16q19-3 35 0t35-1" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="440" height="320" fill="url(#bg)"/>
  <rect width="440" height="200" fill="url(#glow)"/>
  <!-- back bar shelf with bottles -->
  <rect x="60" y="78" width="320" height="7" fill="url(#gold)"/>
  <g fill="#F7F3E8" opacity=".85">
    <path d="M88 42h10v10l4 6v20H84V58l4-6z"/>
    <path d="M130 36h9v12l4 5v25h-17V53l4-5z"/>
    <path d="M304 40h10v11l4 5v22h-18V56l4-5z"/>
    <path d="M344 34h9v13l4 5v26h-17V52l4-5z"/>
  </g>
  <g fill="none" stroke="#C9A227" stroke-width="2.5">
    <path d="M180 50h8v9l3 4v15h-14V63l3-4z"/>
    <path d="M256 46h8v10l3 4v18h-14V60l3-4z"/>
  </g>
  <!-- waterfall bar top: horizontal top wrapping down right end -->
  <rect x="36" y="118" width="356" height="18" fill="url(#grainh)"/>
  <rect x="36" y="118" width="356" height="18" fill="none" stroke="#0A1826" stroke-width="3"/>
  <rect x="374" y="118" width="18" height="174" fill="url(#grainv)"/>
  <rect x="374" y="118" width="18" height="174" fill="none" stroke="#0A1826" stroke-width="3"/>
  <!-- bar front: vertical boards -->
  <rect x="52" y="136" width="322" height="156" fill="url(#grainv)" opacity=".92"/>
  <rect x="52" y="136" width="322" height="156" fill="none" stroke="#0A1826" stroke-width="3"/>
  <path d="M96 136v156M140 136v156M184 136v156M228 136v156M272 136v156M316 136v156" stroke="#9A7B1B" stroke-width="2.5" opacity=".7"/>
  <!-- brass foot rail -->
  <path d="M44 276h316" stroke="#E4BC3F" stroke-width="6" stroke-linecap="round"/>
  <!-- stools -->
  <g stroke="#F7F3E8" stroke-width="4" fill="none" opacity=".9">
    <path d="M104 320v-18M148 320v-18M112 302h28"/>
    <path d="M232 320v-18M276 320v-18M240 302h28"/>
  </g>
  <!-- glass on bar -->
  <path d="M206 96h20l-3 22h-14z" fill="none" stroke="#F7F3E8" stroke-width="2.5"/>
  <rect y="304" width="440" height="16" fill="#0A1826"/>
</svg>

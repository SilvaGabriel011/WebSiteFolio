<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4BC3F"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <pattern id="grain" width="60" height="18" patternUnits="userSpaceOnUse">
      <rect width="60" height="18" fill="#C9A227"/>
      <path d="M0 4q15-3 30 0t30 0" fill="none" stroke="#9A7B1B" stroke-width="1" opacity=".55"/>
      <path d="M0 9q12 3 30 1t30 1" fill="none" stroke="#9A7B1B" stroke-width=".9" opacity=".45"/>
      <path d="M0 14q17-3 30 0t30-1" fill="none" stroke="#9A7B1B" stroke-width=".9" opacity=".5"/>
    </pattern>
  </defs>
  <circle cx="80" cy="80" r="76" fill="#0F2540"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#F7F3E8" stroke-width="1.5" opacity=".45"/>
  <!-- dovetail joint: gold board (pins) meets pale board (tails) -->
  <path d="M34 52h36v10l14 6-14 6v12l14 6-14 6v10H34z" fill="url(#grain)" stroke="#0A1826" stroke-width="2.5"/>
  <path d="M126 52H90v10l14 6-14 6v12l14 6-14 6v10h36z" fill="#F7F3E8" stroke="#0A1826" stroke-width="2.5"/>
  <path d="M90 62l14 6-14 6M90 86l14 6-14 6" fill="none" stroke="#9A7B1B" stroke-width="2"/>
  <!-- mallet above the joint -->
  <path d="M80 30v14" stroke="#E4BC3F" stroke-width="3" stroke-linecap="round"/>
  <rect x="68" y="20" width="24" height="10" rx="3" fill="url(#gold)"/>
  <!-- chisel below -->
  <path d="M80 116v14" stroke="#E4BC3F" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 130h8l-4 8z" fill="#F7F3E8"/>
</svg>

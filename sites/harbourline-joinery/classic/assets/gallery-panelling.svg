<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylised boardroom with full-height timber wall panelling and a long table">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3C5F"/><stop offset="1" stop-color="#0F2438"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9B44A"/><stop offset=".5" stop-color="#C9A227"/><stop offset="1" stop-color="#A8861E"/>
    </linearGradient>
    <pattern id="grain" width="140" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 8q35-8 70 0t70 0" fill="none" stroke="#7A620E" stroke-opacity=".3" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#C9A227" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- panelled wall -->
  <rect x="60" y="60" width="680" height="330" fill="url(#oak)"/>
  <rect x="60" y="60" width="680" height="330" fill="url(#grain)"/>
  <!-- picture rail + chair rail -->
  <rect x="60" y="88" width="680" height="8" fill="#7A620E"/>
  <rect x="60" y="268" width="680" height="10" fill="#7A620E"/>
  <!-- upper panels -->
  <g fill="none" stroke="#7A620E" stroke-width="5">
    <rect x="88" y="116" width="140" height="124" rx="2"/>
    <rect x="252" y="116" width="140" height="124" rx="2"/>
    <rect x="416" y="116" width="140" height="124" rx="2"/>
    <rect x="580" y="116" width="132" height="124" rx="2"/>
  </g>
  <g fill="none" stroke="#F4EFE4" stroke-opacity=".4" stroke-width="2.5">
    <rect x="98" y="126" width="120" height="104"/>
    <rect x="262" y="126" width="120" height="104"/>
    <rect x="426" y="126" width="120" height="104"/>
    <rect x="590" y="126" width="112" height="104"/>
  </g>
  <!-- lower wainscot -->
  <g fill="none" stroke="#7A620E" stroke-width="5">
    <rect x="88" y="298" width="140" height="66" rx="2"/>
    <rect x="252" y="298" width="140" height="66" rx="2"/>
    <rect x="416" y="298" width="140" height="66" rx="2"/>
    <rect x="580" y="298" width="132" height="66" rx="2"/>
  </g>

  <!-- boardroom table -->
  <g>
    <rect x="140" y="430" width="520" height="26" rx="10" fill="#16324F" stroke="#F4EFE4" stroke-opacity=".7" stroke-width="3"/>
    <path d="M180 456v84M620 456v84" stroke="#F4EFE4" stroke-opacity=".7" stroke-width="8"/>
    <!-- chair backs -->
    <g fill="#0E2236" stroke="#C9A227" stroke-width="3">
      <rect x="210" y="470" width="64" height="52" rx="8"/>
      <rect x="310" y="470" width="64" height="52" rx="8"/>
      <rect x="410" y="470" width="64" height="52" rx="8"/>
      <rect x="510" y="470" width="64" height="52" rx="8"/>
    </g>
  </g>
  <line x1="40" y1="540" x2="760" y2="540" stroke="#F4EFE4" stroke-opacity=".3" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a walk-in wardrobe fit-out with hanging bays and a drawer bank">
  <defs>
    <linearGradient id="tw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CB9E66"/>
      <stop offset="1" stop-color="#9E7038"/>
    </linearGradient>
    <pattern id="gw" width="26" height="160" patternUnits="userSpaceOnUse">
      <path d="M6 0 Q2 40 6 80 T6 160" fill="none" stroke="#6E4E22" stroke-opacity=".2" stroke-width="1.2"/>
      <path d="M14 0 Q10 40 14 80 T14 160" fill="none" stroke="#6E4E22" stroke-opacity=".13" stroke-width="1"/>
      <path d="M22 0 Q18 40 22 80 T22 160" fill="none" stroke="#6E4E22" stroke-opacity=".17" stroke-width="1.1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#2B2620"/>
  <rect x="0" y="540" width="800" height="60" fill="#241F19"/>
  <rect x="0" y="536" width="800" height="4" fill="#B98A4E" opacity=".5"/>

  <!-- carcass frame -->
  <rect x="60" y="60" width="680" height="476" fill="#3A322A"/>
  <rect x="60" y="60" width="680" height="16" fill="url(#tw)"/>
  <rect x="60" y="60" width="16" height="476" fill="url(#tw)"/>
  <rect x="724" y="60" width="16" height="476" fill="url(#tw)"/>

  <!-- left hanging bay -->
  <rect x="92" y="92" width="196" height="444" fill="#332B23"/>
  <rect x="92" y="120" width="196" height="8" fill="url(#tw)"/>
  <g stroke="#E9DDC4" stroke-width="3" fill="none" opacity=".85">
    <path d="M118 128 v14 M118 142 c-14 10 -16 52 0 66 c16 -14 14 -56 0 -66" />
    <path d="M156 128 v14 M156 142 c-15 11 -17 60 0 74 c17 -14 15 -63 0 -74"/>
    <path d="M196 128 v14 M196 142 c-14 10 -16 52 0 66 c16 -14 14 -56 0 -66"/>
    <path d="M234 128 v14 M234 142 c-15 11 -17 60 0 74 c17 -14 15 -63 0 -74"/>
  </g>
  <rect x="92" y="300" width="196" height="8" fill="url(#tw)"/>
  <g stroke="#B98A4E" stroke-width="3" fill="none" opacity=".9">
    <path d="M126 308 v14 M126 322 c-14 10 -16 58 0 72 c16 -14 14 -62 0 -72"/>
    <path d="M170 308 v14 M170 322 c-15 11 -17 66 0 80 c17 -14 15 -69 0 -80"/>
    <path d="M214 308 v14 M214 322 c-14 10 -16 58 0 72 c16 -14 14 -62 0 -72"/>
  </g>

  <!-- centre shelf & drawer stack -->
  <rect x="304" y="92" width="192" height="444" fill="#332B23"/>
  <g fill="url(#tw)">
    <rect x="304" y="150" width="192" height="8"/>
    <rect x="304" y="216" width="192" height="8"/>
    <rect x="304" y="282" width="192" height="8"/>
  </g>
  <!-- folded garments -->
  <g fill="#E9DDC4" opacity=".85">
    <rect x="322" y="118" width="64" height="10" rx="2"/>
    <rect x="322" y="130" width="64" height="10" rx="2"/>
    <rect x="404" y="124" width="58" height="10" rx="2" fill="#B98A4E"/>
    <rect x="322" y="186" width="58" height="10" rx="2" fill="#B98A4E"/>
    <rect x="322" y="198" width="58" height="10" rx="2"/>
    <rect x="398" y="192" width="64" height="10" rx="2"/>
    <rect x="322" y="252" width="64" height="10" rx="2"/>
    <rect x="404" y="258" width="58" height="10" rx="2" fill="#B98A4E"/>
  </g>
  <!-- drawers -->
  <g>
    <rect x="312" y="306" width="176" height="52" fill="url(#tw)"/>
    <rect x="312" y="306" width="176" height="52" fill="url(#gw)"/>
    <rect x="312" y="366" width="176" height="52" fill="url(#tw)"/>
    <rect x="312" y="366" width="176" height="52" fill="url(#gw)"/>
    <rect x="312" y="426" width="176" height="52" fill="url(#tw)"/>
    <rect x="312" y="426" width="176" height="52" fill="url(#gw)"/>
    <rect x="370" y="328" width="60" height="5" rx="2.5" fill="#241F19"/>
    <rect x="370" y="388" width="60" height="5" rx="2.5" fill="#241F19"/>
    <rect x="370" y="448" width="60" height="5" rx="2.5" fill="#241F19"/>
  </g>

  <!-- right hanging bay -->
  <rect x="512" y="92" width="196" height="444" fill="#332B23"/>
  <rect x="512" y="120" width="196" height="8" fill="url(#tw)"/>
  <g stroke="#E9DDC4" stroke-width="3" fill="none" opacity=".85">
    <path d="M542 128 v14 M542 142 c-15 12 -18 88 0 104 c18 -16 15 -92 0 -104"/>
    <path d="M588 128 v14 M588 142 c-16 13 -19 102 0 118 c19 -16 16 -105 0 -118"/>
    <path d="M634 128 v14 M634 142 c-15 12 -18 88 0 104 c18 -16 15 -92 0 -104"/>
    <path d="M678 128 v14 M678 142 c-16 13 -19 102 0 118 c19 -16 16 -105 0 -118"/>
  </g>
  <rect x="512" y="330" width="196" height="8" fill="url(#tw)"/>
  <!-- shoe shelf rows -->
  <g fill="#B98A4E" opacity=".9">
    <rect x="530" y="356" width="34" height="12" rx="6"/>
    <rect x="574" y="356" width="34" height="12" rx="6"/>
    <rect x="618" y="356" width="34" height="12" rx="6"/>
    <rect x="662" y="356" width="34" height="12" rx="6"/>
  </g>
  <rect x="512" y="392" width="196" height="8" fill="url(#tw)"/>
  <g fill="#E9DDC4" opacity=".75">
    <rect x="530" y="418" width="34" height="12" rx="6"/>
    <rect x="574" y="418" width="34" height="12" rx="6"/>
    <rect x="618" y="418" width="34" height="12" rx="6"/>
  </g>
  <rect x="512" y="454" width="196" height="8" fill="url(#tw)"/>

  <!-- warm downlights -->
  <g fill="#E9C98F" opacity=".9">
    <circle cx="190" cy="76" r="5"/>
    <circle cx="400" cy="76" r="5"/>
    <circle cx="610" cy="76" r="5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Illustration of bespoke timber cabinet fronts with a dovetail joint detail">
  <defs>
    <linearGradient id="timber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CB9E66"/>
      <stop offset=".55" stop-color="#B98A4E"/>
      <stop offset="1" stop-color="#9E7038"/>
    </linearGradient>
    <linearGradient id="timberDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F6531"/>
      <stop offset="1" stop-color="#74501F"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EBDA"/>
      <stop offset="1" stop-color="#E9DDC4"/>
    </linearGradient>
    <pattern id="grain" width="180" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 7 Q45 3 90 7 T180 7" fill="none" stroke="#6E4E22" stroke-opacity=".22" stroke-width="1.3"/>
      <path d="M0 16 Q45 11 90 16 T180 16" fill="none" stroke="#6E4E22" stroke-opacity=".14" stroke-width="1.1"/>
      <path d="M0 25 Q45 21 90 25 T180 25" fill="none" stroke="#6E4E22" stroke-opacity=".18" stroke-width="1.2"/>
      <ellipse cx="120" cy="12" rx="11" ry="3.4" fill="none" stroke="#6E4E22" stroke-opacity=".2" stroke-width="1"/>
      <ellipse cx="120" cy="12" rx="5.5" ry="1.7" fill="none" stroke="#6E4E22" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <pattern id="grainV" width="30" height="180" patternUnits="userSpaceOnUse">
      <path d="M7 0 Q3 45 7 90 T7 180" fill="none" stroke="#6E4E22" stroke-opacity=".2" stroke-width="1.2"/>
      <path d="M16 0 Q11 45 16 90 T16 180" fill="none" stroke="#6E4E22" stroke-opacity=".13" stroke-width="1.1"/>
      <path d="M25 0 Q21 45 25 90 T25 180" fill="none" stroke="#6E4E22" stroke-opacity=".17" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="640" fill="url(#wallGrad)"/>
  <rect x="0" y="560" width="800" height="80" fill="#D9C9A8"/>
  <rect x="0" y="556" width="800" height="4" fill="#C4B18B"/>

  <!-- tall cabinet run, left -->
  <g>
    <rect x="56" y="96" width="212" height="460" fill="url(#timberDeep)"/>
    <rect x="66" y="106" width="192" height="212" fill="url(#timber)"/>
    <rect x="66" y="106" width="192" height="212" fill="url(#grainV)"/>
    <rect x="82" y="122" width="160" height="180" fill="none" stroke="#5F3F17" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="66" y="330" width="192" height="212" fill="url(#timber)"/>
    <rect x="66" y="330" width="192" height="212" fill="url(#grainV)"/>
    <rect x="82" y="346" width="160" height="180" fill="none" stroke="#5F3F17" stroke-opacity=".55" stroke-width="2.5"/>
    <circle cx="244" cy="212" r="5" fill="#241F19"/>
    <circle cx="244" cy="436" r="5" fill="#241F19"/>
  </g>

  <!-- bench run centre -->
  <g>
    <rect x="292" y="336" width="332" height="18" fill="#241F19"/>
    <rect x="300" y="354" width="316" height="188" fill="url(#timber)"/>
    <rect x="300" y="354" width="316" height="188" fill="url(#grain)"/>
    <!-- drawer fronts -->
    <rect x="312" y="366" width="292" height="52" fill="none" stroke="#5F3F17" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="312" y="430" width="292" height="52" fill="none" stroke="#5F3F17" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="312" y="494" width="292" height="36" fill="none" stroke="#5F3F17" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="428" y="386" width="60" height="6" rx="3" fill="#241F19"/>
    <rect x="428" y="450" width="60" height="6" rx="3" fill="#241F19"/>
  </g>

  <!-- open shelf above bench -->
  <g>
    <rect x="300" y="150" width="316" height="12" fill="#8F6531"/>
    <rect x="300" y="240" width="316" height="12" fill="#8F6531"/>
    <rect x="322" y="176" width="16" height="64" fill="#40342A"/>
    <rect x="344" y="188" width="12" height="52" fill="#B98A4E"/>
    <rect x="362" y="180" width="14" height="60" fill="#241F19"/>
    <rect x="384" y="192" width="10" height="48" fill="#8F6531"/>
    <ellipse cx="452" cy="222" rx="26" ry="18" fill="#40342A"/>
    <rect x="446" y="196" width="12" height="14" fill="#40342A"/>
    <rect x="520" y="176" width="16" height="64" fill="#B98A4E"/>
    <rect x="544" y="186" width="12" height="54" fill="#40342A"/>
    <rect x="562" y="194" width="14" height="46" fill="#8F6531"/>
  </g>

  <!-- dovetail detail plate, right -->
  <g>
    <circle cx="686" cy="286" r="96" fill="#241F19"/>
    <circle cx="686" cy="286" r="96" fill="none" stroke="#B98A4E" stroke-width="3"/>
    <circle cx="686" cy="286" r="86" fill="none" stroke="#B98A4E" stroke-opacity=".4" stroke-width="1.5"/>
    <!-- dovetail pins & tails -->
    <g transform="translate(686 286)">
      <path d="M-58 -10 L-38 -26 L-38 6 L-58 22 Z" fill="url(#timber)"/>
      <path d="M-30 -26 L-10 -10 L-10 22 L-30 6 Z" fill="#E9DDC4"/>
      <path d="M-2 -10 L18 -26 L18 6 L-2 22 Z" fill="url(#timber)"/>
      <path d="M26 -26 L46 -10 L46 22 L26 6 Z" fill="#E9DDC4"/>
      <path d="M-58 -10 L-38 -26 M-30 -26 L-10 -10 M-2 -10 L18 -26 M26 -26 L46 -10" stroke="#B98A4E" stroke-width="1.4" fill="none"/>
    </g>
  </g>

  <!-- pendant light -->
  <g stroke="#241F19" stroke-width="3" fill="none">
    <line x1="452" y1="0" x2="452" y2="86"/>
    <path d="M430 86 h44 l-8 26 h-28 Z" fill="#241F19" stroke="none"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="400" cy="576" rx="330" ry="14" fill="#241F19" opacity=".12"/>
</svg>

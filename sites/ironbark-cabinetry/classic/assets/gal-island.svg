<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of an oak-veneer kitchen island with pendant lights and stools">
  <defs>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CB9E66"/>
      <stop offset=".5" stop-color="#B98A4E"/>
      <stop offset="1" stop-color="#A67C42"/>
    </linearGradient>
    <pattern id="gi" width="200" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q50 2 100 6 T200 6" fill="none" stroke="#6E4E22" stroke-opacity=".22" stroke-width="1.2"/>
      <path d="M0 14 Q50 10 100 14 T200 14" fill="none" stroke="#6E4E22" stroke-opacity=".13" stroke-width="1"/>
      <path d="M0 22 Q50 18 100 22 T200 22" fill="none" stroke="#6E4E22" stroke-opacity=".18" stroke-width="1.1"/>
      <ellipse cx="140" cy="10" rx="10" ry="3" fill="none" stroke="#6E4E22" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
    <linearGradient id="wallI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EBDA"/>
      <stop offset="1" stop-color="#E7DAC0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wallI)"/>
  <rect x="0" y="508" width="800" height="92" fill="#D9C9A8"/>
  <rect x="0" y="504" width="800" height="4" fill="#C4B18B"/>

  <!-- back run, muted -->
  <g opacity=".55">
    <rect x="70" y="180" width="660" height="14" fill="#8F6531"/>
    <rect x="70" y="194" width="660" height="130" fill="#EFE6D2"/>
    <rect x="70" y="194" width="660" height="130" fill="none" stroke="#C4B18B" stroke-width="2"/>
    <line x1="235" y1="194" x2="235" y2="324" stroke="#C4B18B" stroke-width="2"/>
    <line x1="400" y1="194" x2="400" y2="324" stroke="#C4B18B" stroke-width="2"/>
    <line x1="565" y1="194" x2="565" y2="324" stroke="#C4B18B" stroke-width="2"/>
  </g>

  <!-- pendants -->
  <g stroke="#241F19" stroke-width="3" fill="none">
    <line x1="290" y1="0" x2="290" y2="120"/>
    <line x1="400" y1="0" x2="400" y2="120"/>
    <line x1="510" y1="0" x2="510" y2="120"/>
  </g>
  <g fill="#241F19">
    <path d="M266 120 h48 l-9 30 h-30 Z"/>
    <path d="M376 120 h48 l-9 30 h-30 Z"/>
    <path d="M486 120 h48 l-9 30 h-30 Z"/>
  </g>
  <g fill="#E9C98F">
    <circle cx="290" cy="156" r="5"/>
    <circle cx="400" cy="156" r="5"/>
    <circle cx="510" cy="156" r="5"/>
  </g>

  <!-- island -->
  <g>
    <rect x="150" y="300" width="500" height="22" fill="#241F19"/>
    <rect x="150" y="322" width="500" height="166" fill="url(#ti)"/>
    <rect x="150" y="322" width="500" height="166" fill="url(#gi)"/>
    <!-- waterfall ends -->
    <rect x="150" y="300" width="20" height="188" fill="#8F6531"/>
    <rect x="630" y="300" width="20" height="188" fill="#8F6531"/>
    <!-- slab door lines -->
    <g stroke="#5F3F17" stroke-opacity=".5" stroke-width="2.5" fill="none">
      <line x1="292" y1="330" x2="292" y2="480"/>
      <line x1="400" y1="330" x2="400" y2="480"/>
      <line x1="508" y1="330" x2="508" y2="480"/>
    </g>
    <!-- finger pulls -->
    <g fill="#241F19">
      <rect x="252" y="336" width="34" height="5" rx="2.5"/>
      <rect x="360" y="336" width="34" height="5" rx="2.5"/>
      <rect x="468" y="336" width="34" height="5" rx="2.5"/>
      <rect x="576" y="336" width="34" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- benchtop props -->
  <g>
    <ellipse cx="252" cy="292" rx="34" ry="9" fill="#40342A"/>
    <rect x="246" y="266" width="12" height="20" fill="#40342A"/>
    <circle cx="560" cy="284" r="16" fill="none" stroke="#40342A" stroke-width="5"/>
    <path d="M545 300 q15 8 30 0" fill="none" stroke="#40342A" stroke-width="5"/>
  </g>

  <!-- stools -->
  <g stroke="#241F19" stroke-width="5" fill="none">
    <line x1="308" y1="498" x2="308" y2="560"/>
    <line x1="368" y1="498" x2="368" y2="560"/>
    <rect x="296" y="486" width="84" height="12" rx="6" fill="#241F19" stroke="none"/>
    <line x1="452" y1="498" x2="452" y2="560"/>
    <line x1="512" y1="498" x2="512" y2="560"/>
    <rect x="440" y="486" width="84" height="12" rx="6" fill="#241F19" stroke="none"/>
  </g>

  <ellipse cx="400" cy="560" rx="300" ry="12" fill="#241F19" opacity=".1"/>
</svg>

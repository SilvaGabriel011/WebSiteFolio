<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a wall-hung entertainment unit with slatted doors and concealed cabling">
  <defs>
    <linearGradient id="te" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CB9E66"/>
      <stop offset="1" stop-color="#A67C42"/>
    </linearGradient>
    <pattern id="slat" width="18" height="120" patternUnits="userSpaceOnUse">
      <rect width="18" height="120" fill="#B98A4E"/>
      <rect x="12" width="6" height="120" fill="#8F6531"/>
    </pattern>
    <linearGradient id="wallE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A322A"/>
      <stop offset="1" stop-color="#2B2620"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wallE)"/>
  <rect x="0" y="524" width="800" height="76" fill="#241F19"/>
  <rect x="0" y="520" width="800" height="4" fill="#B98A4E" opacity=".45"/>

  <!-- TV -->
  <rect x="252" y="70" width="296" height="180" rx="6" fill="#191612"/>
  <rect x="252" y="70" width="296" height="180" rx="6" fill="none" stroke="#4A4238" stroke-width="3"/>
  <path d="M270 96 q130 -22 260 0" fill="none" stroke="#B98A4E" stroke-opacity=".35" stroke-width="2"/>

  <!-- hidden cabling motif: dashed run disappearing into unit -->
  <path d="M400 250 v54" stroke="#E9C98F" stroke-width="3" stroke-dasharray="3 9" fill="none" stroke-linecap="round"/>
  <circle cx="400" cy="308" r="6" fill="none" stroke="#E9C98F" stroke-width="2"/>

  <!-- floating unit -->
  <g>
    <rect x="96" y="318" width="608" height="16" fill="url(#te)"/>
    <rect x="104" y="334" width="592" height="128" fill="#241F19"/>
    <!-- slat door left -->
    <rect x="116" y="346" width="160" height="104" fill="url(#slat)"/>
    <rect x="116" y="346" width="160" height="104" fill="none" stroke="#191612" stroke-width="3"/>
    <!-- open shelf with warm glow + gear -->
    <rect x="288" y="346" width="224" height="104" fill="#332B23"/>
    <rect x="288" y="440" width="224" height="10" fill="#E9C98F" opacity=".25"/>
    <rect x="308" y="404" width="120" height="16" rx="3" fill="#191612"/>
    <circle cx="418" cy="412" r="4" fill="#E9C98F"/>
    <rect x="308" y="376" width="86" height="14" rx="3" fill="#40342A"/>
    <ellipse cx="470" cy="416" rx="20" ry="14" fill="#B98A4E"/>
    <rect x="464" y="394" width="11" height="11" fill="#B98A4E"/>
    <!-- slat door right -->
    <rect x="524" y="346" width="160" height="104" fill="url(#slat)"/>
    <rect x="524" y="346" width="160" height="104" fill="none" stroke="#191612" stroke-width="3"/>
    <!-- base shadow line -->
    <rect x="104" y="462" width="592" height="8" fill="#8F6531"/>
    <!-- under-unit glow -->
    <rect x="130" y="478" width="540" height="6" rx="3" fill="#E9C98F" opacity=".5"/>
  </g>

  <!-- vinyl + speaker props -->
  <g>
    <rect x="120" y="266" width="46" height="46" fill="#40342A"/>
    <circle cx="143" cy="289" r="14" fill="#241F19"/>
    <circle cx="143" cy="289" r="4" fill="#B98A4E"/>
    <rect x="636" y="242" width="44" height="70" rx="5" fill="#40342A"/>
    <circle cx="658" cy="264" r="10" fill="#241F19"/>
    <circle cx="658" cy="292" r="13" fill="#241F19"/>
  </g>

  <ellipse cx="400" cy="548" rx="300" ry="10" fill="#000000" opacity=".25"/>
</svg>

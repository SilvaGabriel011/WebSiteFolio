<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of a cabinet maker's workbench with a hand plane and timber shavings">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CB9E66"/>
      <stop offset="1" stop-color="#A67C42"/>
    </linearGradient>
    <pattern id="gb" width="190" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q48 2 95 6 T190 6" fill="none" stroke="#6E4E22" stroke-opacity=".22" stroke-width="1.2"/>
      <path d="M0 14 Q48 10 95 14 T190 14" fill="none" stroke="#6E4E22" stroke-opacity=".14" stroke-width="1"/>
      <path d="M0 22 Q48 18 95 22 T190 22" fill="none" stroke="#6E4E22" stroke-opacity=".18" stroke-width="1.1"/>
      <ellipse cx="60" cy="10" rx="10" ry="3" fill="none" stroke="#6E4E22" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="560" fill="#EFE6D2"/>
  <rect x="0" y="500" width="800" height="60" fill="#D9C9A8"/>
  <rect x="0" y="496" width="800" height="4" fill="#C4B18B"/>

  <!-- pegboard wall of tools -->
  <g>
    <rect x="60" y="52" width="680" height="180" fill="#E4D7BC"/>
    <rect x="60" y="52" width="680" height="180" fill="none" stroke="#C4B18B" stroke-width="3"/>
    <!-- saw -->
    <g transform="translate(120 90)">
      <path d="M0 22 L96 10 L96 40 L14 46 Z" fill="#E9DDC4" stroke="#B4A582" stroke-width="2"/>
      <rect x="96" y="12" width="34" height="24" rx="8" fill="#8F6531"/>
    </g>
    <!-- chisels -->
    <g>
      <rect x="292" y="86" width="10" height="56" rx="3" fill="#8F6531"/>
      <rect x="294" y="142" width="6" height="34" fill="#B4A582"/>
      <rect x="322" y="86" width="10" height="56" rx="3" fill="#6E4E22"/>
      <rect x="324" y="142" width="6" height="34" fill="#B4A582"/>
      <rect x="352" y="86" width="10" height="56" rx="3" fill="#8F6531"/>
      <rect x="354" y="142" width="6" height="26" fill="#B4A582"/>
    </g>
    <!-- square -->
    <path d="M420 90 h84 v14 h-70 v70 h-14 Z" fill="#241F19"/>
    <!-- mallet -->
    <g transform="translate(560 84)">
      <rect x="0" y="0" width="64" height="34" rx="8" fill="#8F6531"/>
      <rect x="26" y="34" width="12" height="68" rx="4" fill="#B98A4E"/>
    </g>
    <!-- clamps -->
    <g stroke="#40342A" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M680 84 v96 M680 84 h26 M680 180 h26"/>
    </g>
  </g>

  <!-- workbench -->
  <g>
    <rect x="40" y="288" width="720" height="26" fill="#241F19"/>
    <rect x="52" y="314" width="696" height="26" fill="url(#tb)"/>
    <rect x="52" y="314" width="696" height="26" fill="url(#gb)"/>
    <rect x="76" y="340" width="30" height="160" fill="#8F6531"/>
    <rect x="694" y="340" width="30" height="160" fill="#8F6531"/>
    <rect x="76" y="404" width="648" height="14" fill="#B98A4E"/>
  </g>

  <!-- timber board on bench -->
  <g transform="rotate(-3 400 268)">
    <rect x="220" y="252" width="360" height="34" rx="4" fill="url(#tb)"/>
    <rect x="220" y="252" width="360" height="34" rx="4" fill="url(#gb)"/>
  </g>

  <!-- hand plane -->
  <g transform="translate(430 208)">
    <path d="M0 44 q6 -18 34 -18 h94 q28 0 34 18 Z" fill="#241F19"/>
    <rect x="62" y="-6" width="14" height="34" rx="5" fill="#8F6531"/>
    <circle cx="118" cy="12" r="12" fill="#8F6531"/>
  </g>

  <!-- shaving curls -->
  <g fill="none" stroke="#B98A4E" stroke-width="4" stroke-linecap="round">
    <path d="M180 268 a12 12 0 1 1 20 8 a8 8 0 1 0 12 6"/>
    <path d="M250 278 a10 10 0 1 1 18 6 a7 7 0 1 0 10 5"/>
    <path d="M620 274 a11 11 0 1 1 19 7 a8 8 0 1 0 11 5"/>
  </g>

  <!-- stacked boards under bench -->
  <g>
    <rect x="140" y="452" width="380" height="14" rx="3" fill="#B98A4E"/>
    <rect x="160" y="434" width="340" height="14" rx="3" fill="#8F6531"/>
    <rect x="180" y="416" width="300" height="14" rx="3" fill="#CB9E66"/>
  </g>

  <ellipse cx="400" cy="516" rx="320" ry="12" fill="#241F19" opacity=".08"/>
</svg>

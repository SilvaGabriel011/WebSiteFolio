<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-labelledby="st sd">
  <title id="st">The Brunswick workshop bench</title>
  <desc id="sd">Abstract workshop scene: a heavy timber workbench with hand tools, clamped board and a stack of dressed timber.</desc>
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241E15"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <pattern id="sBench" width="140" height="26" patternUnits="userSpaceOnUse">
      <rect width="140" height="26" fill="#B98A4E"/>
      <path d="M0 6q35-5 70 0t70 0" fill="none" stroke="#8A6130" stroke-width="1.4" opacity=".55"/>
      <path d="M0 14q28 6 66 1t74 2" fill="none" stroke="#8A6130" stroke-width="1" opacity=".4"/>
      <path d="M0 21q40-4 80 0t60-2" fill="none" stroke="#74501F" stroke-width="1" opacity=".35"/>
      <ellipse cx="48" cy="11" rx="8" ry="3" fill="none" stroke="#74501F" stroke-width="1" opacity=".4"/>
    </pattern>
    <pattern id="sOak" width="120" height="20" patternUnits="userSpaceOnUse">
      <rect width="120" height="20" fill="#C89B5F"/>
      <path d="M0 5q30-4 60 0t60 0" fill="none" stroke="#9A7038" stroke-width="1.2" opacity=".5"/>
      <path d="M0 13q26 5 58 1t62 2" fill="none" stroke="#835D2B" stroke-width="1" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="700" height="520" fill="url(#sBg)"/>
  <!-- pegboard of tools -->
  <rect x="60" y="42" width="580" height="150" fill="#1B1610" stroke="#332B1F" stroke-width="2.5"/>
  <g stroke="#D8A45F" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M120 70v70M104 86h32"/><!-- chisel cross -->
    <path d="M200 70v54M186 124h28l-14 18z" fill="#D8A45F"/><!-- awl -->
    <path d="M290 76h60M290 76l-14 46h88l-14-46" /><!-- saw shape -->
    <circle cx="470" cy="104" r="30"/><path d="M470 74v60M440 104h60"/><!-- square/dividers hint -->
    <path d="M570 70l24 70M594 70l-24 70"/><!-- calipers -->
  </g>
  <!-- clamped board on bench -->
  <rect x="150" y="238" width="330" height="26" fill="url(#sOak)"/>
  <g fill="#3F362A">
    <rect x="140" y="224" width="26" height="54" rx="4"/>
    <rect x="464" y="224" width="26" height="54" rx="4"/>
  </g>
  <g stroke="#D8A45F" stroke-width="5" stroke-linecap="round">
    <line x1="153" y1="224" x2="153" y2="206"/>
    <line x1="477" y1="224" x2="477" y2="206"/>
  </g>
  <!-- hand plane on board -->
  <path d="M520 250q6-22 34-22h56q20 0 18 22z" fill="#8A6130"/>
  <rect x="548" y="214" width="12" height="20" rx="3" fill="#1F1D1A"/>
  <!-- bench top + legs -->
  <rect x="60" y="264" width="580" height="34" fill="url(#sBench)"/>
  <rect x="60" y="264" width="580" height="34" fill="none" stroke="#5E3F17" stroke-width="3"/>
  <g fill="#8A6130">
    <rect x="96" y="298" width="34" height="160"/>
    <rect x="570" y="298" width="34" height="160"/>
  </g>
  <rect x="96" y="368" width="508" height="16" fill="#8A6130" opacity=".8"/>
  <!-- timber stack -->
  <g>
    <rect x="180" y="404" width="240" height="18" fill="url(#sOak)"/>
    <rect x="210" y="426" width="240" height="18" fill="url(#sOak)" opacity=".85"/>
    <rect x="190" y="448" width="240" height="18" fill="url(#sOak)" opacity=".7"/>
  </g>
  <!-- shavings curl -->
  <g fill="none" stroke="#D8A45F" stroke-width="3" opacity=".8">
    <path d="M488 452q18-20 2-30t6-22"/>
    <path d="M520 458q14-16 0-26t8-20"/>
  </g>
  <!-- floor -->
  <rect x="0" y="470" width="700" height="50" fill="#0F0C08"/>
  <line x1="0" y1="470" x2="700" y2="470" stroke="#3B3226" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-labelledby="ht hd">
  <title id="ht">Charcoal and timber cabinetry wall</title>
  <desc id="hd">Abstract illustration of a dark kitchen: charcoal overhead cabinets, amber woodgrain drawer bank and a glowing pendant light.</desc>
  <defs>
    <linearGradient id="hRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241E15"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <linearGradient id="hGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8A45F" stop-opacity=".5"/>
      <stop offset="1" stop-color="#D8A45F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EADA"/>
      <stop offset="1" stop-color="#CDBFA6"/>
    </linearGradient>
    <pattern id="hGrain" width="150" height="30" patternUnits="userSpaceOnUse">
      <rect width="150" height="30" fill="#B98A4E"/>
      <path d="M0 7q38-6 75 0t75 0" fill="none" stroke="#8A6130" stroke-width="1.5" opacity=".55"/>
      <path d="M0 16q30 7 70 1t80 2" fill="none" stroke="#8A6130" stroke-width="1.1" opacity=".4"/>
      <path d="M0 24q42-5 84 0t66-2" fill="none" stroke="#74501F" stroke-width="1" opacity=".38"/>
      <ellipse cx="46" cy="12" rx="8" ry="3" fill="none" stroke="#74501F" stroke-width="1" opacity=".45"/>
      <ellipse cx="112" cy="22" rx="6" ry="2.4" fill="none" stroke="#74501F" stroke-width="1" opacity=".35"/>
    </pattern>
    <pattern id="hGrainV" width="30" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="30" height="150" fill="#A6763D"/>
      <path d="M7 0q-6 38 0 75t0 75" fill="none" stroke="#74501F" stroke-width="1.4" opacity=".5"/>
      <path d="M17 0q7 30 1 70t2 80" fill="none" stroke="#74501F" stroke-width="1" opacity=".4"/>
      <path d="M25 0q-5 42 0 84t-2 66" fill="none" stroke="#5E3F17" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="880" height="660" fill="url(#hRoom)"/>
  <!-- pendant glow -->
  <rect x="562" y="70" width="4" height="66" fill="#3A3126"/>
  <path d="M540 136h48l-8 26h-32z" fill="#1F1A13" stroke="#B98A4E" stroke-width="2"/>
  <ellipse cx="564" cy="164" rx="9" ry="5" fill="#F0C98A"/>
  <path d="M470 168h188l50 240H420z" fill="url(#hGlow)"/>
  <!-- overhead charcoal cabinets -->
  <g stroke="#3B3226" stroke-width="2">
    <rect x="64" y="64" width="150" height="130" fill="#262017"/>
    <rect x="222" y="64" width="150" height="130" fill="#262017"/>
    <rect x="380" y="64" width="110" height="130" fill="#211C14"/>
    <rect x="84" y="84" width="110" height="90" fill="none" opacity=".8"/>
    <rect x="242" y="84" width="110" height="90" fill="none" opacity=".8"/>
  </g>
  <rect x="196" y="118" width="5" height="26" rx="2" fill="#D8A45F"/>
  <rect x="230" y="118" width="5" height="26" rx="2" fill="#D8A45F"/>
  <!-- open shelf with objects -->
  <g>
    <rect x="672" y="64" width="144" height="130" fill="#1B1610" stroke="#3B3226" stroke-width="2"/>
    <line x1="672" y1="129" x2="816" y2="129" stroke="#3B3226" stroke-width="3"/>
    <rect x="688" y="96" width="22" height="30" rx="2" fill="#B98A4E"/>
    <rect x="718" y="86" width="14" height="40" rx="2" fill="#8A6130"/>
    <ellipse cx="768" cy="112" rx="16" ry="13" fill="#F4EADA" opacity=".85"/>
    <rect x="688" y="150" width="46" height="42" fill="#262017"/>
    <rect x="744" y="158" width="58" height="34" rx="2" fill="#B98A4E" opacity=".8"/>
  </g>
  <!-- splashback -->
  <rect x="64" y="214" width="752" height="128" fill="#2A2318"/>
  <g stroke="#3B3226" stroke-width="1" opacity=".65">
    <path d="M64 246h752M64 278h752M64 310h752"/>
    <path d="M158 214v128M252 214v128M346 214v128M440 214v128M534 214v128M628 214v128M722 214v128"/>
  </g>
  <!-- benchtop -->
  <rect x="48" y="342" width="784" height="22" fill="url(#hStone)"/>
  <!-- amber drawer bank -->
  <g>
    <rect x="64" y="364" width="500" height="212" fill="url(#hGrain)"/>
    <g stroke="#5E3F17" stroke-width="3" opacity=".9">
      <line x1="64" y1="434" x2="564" y2="434"/>
      <line x1="64" y1="504" x2="564" y2="504"/>
      <line x1="314" y1="364" x2="314" y2="576"/>
    </g>
    <g fill="#1F1D1A">
      <rect x="164" y="392" width="52" height="7" rx="3.5"/>
      <rect x="414" y="392" width="52" height="7" rx="3.5"/>
      <rect x="164" y="462" width="52" height="7" rx="3.5"/>
      <rect x="414" y="462" width="52" height="7" rx="3.5"/>
      <rect x="164" y="532" width="52" height="7" rx="3.5"/>
      <rect x="414" y="532" width="52" height="7" rx="3.5"/>
    </g>
  </g>
  <!-- tall pantry door, vertical grain -->
  <g>
    <rect x="580" y="364" width="118" height="212" fill="url(#hGrainV)"/>
    <rect x="580" y="364" width="118" height="212" fill="none" stroke="#5E3F17" stroke-width="3"/>
    <rect x="662" y="440" width="7" height="58" rx="3.5" fill="#1F1D1A"/>
  </g>
  <!-- stool -->
  <g stroke="#B98A4E" stroke-width="5" stroke-linecap="round">
    <line x1="756" y1="470" x2="756" y2="600"/>
    <line x1="800" y1="470" x2="800" y2="600"/>
    <line x1="742" y1="466" x2="814" y2="466"/>
    <line x1="756" y1="545" x2="800" y2="545"/>
  </g>
  <!-- floor -->
  <rect x="0" y="600" width="880" height="60" fill="#0F0C08"/>
  <line x1="0" y1="600" x2="880" y2="600" stroke="#3B3226" stroke-width="2"/>
  <!-- dovetail accent strip -->
  <g fill="#B98A4E" opacity=".9">
    <path d="M64 616l16 12-16 12zM112 616l16 12-16 12zM160 616l16 12-16 12z"/>
  </g>
</svg>

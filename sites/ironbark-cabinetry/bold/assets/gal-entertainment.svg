<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="et ed">
  <title id="et">Entertainment unit with hidden cabling</title>
  <desc id="ed">Abstract lounge wall: slatted timber entertainment unit below a screen, with a dashed cable route hidden inside the wall.</desc>
  <defs>
    <linearGradient id="eBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221C13"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <linearGradient id="eLed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C98A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F0C98A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="eSlat" width="18" height="120" patternUnits="userSpaceOnUse">
      <rect width="18" height="120" fill="#1B1610"/>
      <rect x="3" width="10" height="120" fill="#B98A4E"/>
      <path d="M8 0q-3 30 0 60t0 60" fill="none" stroke="#8A6130" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#eBg)"/>
  <!-- feature wall panel -->
  <rect x="90" y="40" width="620" height="420" fill="#1E1912"/>
  <rect x="90" y="40" width="620" height="420" fill="none" stroke="#332B1F" stroke-width="2.5"/>
  <!-- screen -->
  <rect x="220" y="86" width="360" height="204" rx="6" fill="#0C0A07" stroke="#3B3226" stroke-width="3"/>
  <path d="M244 262q80-88 132-52t112-64q26-18 68 8" fill="none" stroke="#D8A45F" stroke-width="3" opacity=".7"/>
  <rect x="220" y="290" width="360" height="8" fill="url(#eLed)"/>
  <!-- hidden cable route (schematic) -->
  <g fill="none" stroke="#D8A45F" stroke-width="3" stroke-dasharray="10 8" opacity=".85">
    <path d="M400 290v56h-160v58"/>
    <path d="M400 346h160v58"/>
  </g>
  <g fill="#D8A45F">
    <circle cx="400" cy="290" r="6"/>
    <circle cx="240" cy="404" r="6"/>
    <circle cx="560" cy="404" r="6"/>
  </g>
  <!-- low unit: slatted doors -->
  <g>
    <rect x="120" y="404" width="560" height="116" fill="url(#eSlat)"/>
    <rect x="120" y="404" width="560" height="116" fill="none" stroke="#5E3F17" stroke-width="3"/>
    <g stroke="#5E3F17" stroke-width="2.5">
      <line x1="306" y1="404" x2="306" y2="520"/>
      <line x1="494" y1="404" x2="494" y2="520"/>
    </g>
    <!-- stone top -->
    <rect x="104" y="392" width="592" height="14" fill="#F4EADA"/>
  </g>
  <!-- legs shadow: unit floats -->
  <rect x="120" y="528" width="560" height="10" rx="5" fill="#000000" opacity=".5"/>
  <!-- speaker + record player on top -->
  <rect x="150" y="356" width="54" height="36" rx="3" fill="#3F362A"/>
  <circle cx="177" cy="374" r="9" fill="#D8A45F" opacity=".8"/>
  <rect x="600" y="366" width="64" height="26" rx="3" fill="#3F362A"/>
  <circle cx="622" cy="379" r="8" fill="#F4EADA" opacity=".7"/>
  <!-- floor -->
  <rect x="0" y="556" width="800" height="44" fill="#0F0C08"/>
  <line x1="0" y1="556" x2="800" y2="556" stroke="#3B3226" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="lt ld">
  <title id="lt">Floor-to-ceiling library wall</title>
  <desc id="ld">Abstract library wall: full-height timber shelving stacked with book spines and a rolling ladder.</desc>
  <defs>
    <linearGradient id="lBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221C13"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <pattern id="lFrame" width="24" height="120" patternUnits="userSpaceOnUse">
      <rect width="24" height="120" fill="#B98A4E"/>
      <path d="M6 0q-4 30 0 60t0 60" fill="none" stroke="#8A6130" stroke-width="1.2" opacity=".5"/>
      <path d="M15 0q5 26 1 60t2 60" fill="none" stroke="#74501F" stroke-width="1" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#lBg)"/>
  <!-- shelving carcass -->
  <rect x="70" y="40" width="660" height="520" fill="#191510"/>
  <g fill="url(#lFrame)">
    <rect x="70" y="40" width="18" height="520"/>
    <rect x="234" y="40" width="14" height="520"/>
    <rect x="394" y="40" width="14" height="520"/>
    <rect x="554" y="40" width="14" height="520"/>
    <rect x="712" y="40" width="18" height="520"/>
  </g>
  <g fill="#B98A4E">
    <rect x="70" y="40" width="660" height="14"/>
    <rect x="70" y="168" width="660" height="10"/>
    <rect x="70" y="296" width="660" height="10"/>
    <rect x="70" y="424" width="660" height="10"/>
    <rect x="70" y="548" width="660" height="12"/>
  </g>
  <!-- books: rows of spines -->
  <g>
    <g fill="#8A6130"><rect x="100" y="70" width="14" height="98"/><rect x="132" y="82" width="10" height="86"/><rect x="160" y="64" width="16" height="104"/><rect x="470" y="76" width="12" height="92"/><rect x="600" y="70" width="14" height="98"/></g>
    <g fill="#D8A45F"><rect x="118" y="76" width="10" height="92"/><rect x="180" y="88" width="12" height="80"/><rect x="262" y="70" width="14" height="98"/><rect x="428" y="88" width="16" height="80"/><rect x="640" y="82" width="10" height="86"/></g>
    <g fill="#F4EADA" opacity=".85"><rect x="146" y="92" width="10" height="76"/><rect x="280" y="84" width="10" height="84"/><rect x="450" y="70" width="14" height="98"/><rect x="618" y="94" width="18" height="74"/></g>
    <g fill="#3F362A"><rect x="298" y="76" width="16" height="92"/><rect x="320" y="92" width="10" height="76"/><rect x="586" y="86" width="10" height="82"/><rect x="660" y="76" width="14" height="92"/></g>
    <!-- leaning book -->
    <rect x="344" y="86" width="12" height="82" fill="#B98A4E" transform="rotate(12 350 168)"/>
  </g>
  <g>
    <g fill="#D8A45F"><rect x="102" y="200" width="12" height="96"/><rect x="256" y="212" width="14" height="84"/><rect x="300" y="198" width="10" height="98"/><rect x="620" y="206" width="12" height="90"/></g>
    <g fill="#8A6130"><rect x="120" y="214" width="14" height="82"/><rect x="142" y="206" width="10" height="90"/><rect x="276" y="222" width="14" height="74"/><rect x="586" y="212" width="16" height="84"/></g>
    <g fill="#F4EADA" opacity=".85"><rect x="158" y="222" width="12" height="74"/><rect x="642" y="220" width="10" height="76"/><rect x="662" y="208" width="14" height="88"/></g>
    <!-- display object in centre bay -->
    <ellipse cx="480" cy="270" rx="24" ry="18" fill="#F4EADA" opacity=".8"/>
    <rect x="440" y="288" width="80" height="8" fill="#8A6130"/>
  </g>
  <g>
    <g fill="#8A6130"><rect x="104" y="330" width="14" height="94"/><rect x="126" y="344" width="10" height="80"/><rect x="430" y="336" width="12" height="88"/><rect x="600" y="330" width="14" height="94"/></g>
    <g fill="#D8A45F"><rect x="144" y="336" width="12" height="88"/><rect x="266" y="330" width="10" height="94"/><rect x="452" y="348" width="16" height="76"/><rect x="622" y="342" width="10" height="82"/></g>
    <g fill="#F4EADA" opacity=".85"><rect x="284" y="342" width="14" height="82"/><rect x="306" y="352" width="10" height="72"/><rect x="476" y="338" width="10" height="86"/></g>
    <g fill="#3F362A"><rect x="162" y="352" width="10" height="72"/><rect x="640" y="336" width="16" height="88"/><rect x="324" y="338" width="12" height="86"/></g>
  </g>
  <g>
    <g fill="#D8A45F"><rect x="102" y="458" width="12" height="90"/><rect x="262" y="470" width="14" height="78"/><rect x="596" y="462" width="12" height="86"/></g>
    <g fill="#8A6130"><rect x="120" y="470" width="14" height="78"/><rect x="284" y="458" width="10" height="90"/><rect x="616" y="474" width="14" height="74"/></g>
    <g fill="#F4EADA" opacity=".85"><rect x="140" y="464" width="10" height="84"/><rect x="302" y="474" width="12" height="74"/></g>
    <!-- closed cabinet doors centre bottom -->
    <rect x="412" y="446" width="138" height="102" fill="#262017" stroke="#3B3226" stroke-width="2"/>
    <line x1="481" y1="446" x2="481" y2="548" stroke="#3B3226" stroke-width="2"/>
    <rect x="466" y="490" width="5" height="22" rx="2.5" fill="#D8A45F"/>
    <rect x="490" y="490" width="5" height="22" rx="2.5" fill="#D8A45F"/>
  </g>
  <!-- ladder -->
  <g stroke="#D8A45F" stroke-width="6" stroke-linecap="round">
    <line x1="672" y1="60" x2="596" y2="556"/>
    <line x1="716" y1="60" x2="640" y2="556"/>
  </g>
  <g stroke="#D8A45F" stroke-width="4" stroke-linecap="round">
    <line x1="662" y1="128" x2="706" y2="128"/>
    <line x1="650" y1="204" x2="694" y2="204"/>
    <line x1="638" y1="280" x2="682" y2="280"/>
    <line x1="626" y1="356" x2="670" y2="356"/>
    <line x1="614" y1="432" x2="658" y2="432"/>
    <line x1="602" y1="508" x2="646" y2="508"/>
  </g>
  <!-- floor -->
  <rect x="0" y="560" width="800" height="40" fill="#0F0C08"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#3B3226" stroke-width="2"/>
</svg>

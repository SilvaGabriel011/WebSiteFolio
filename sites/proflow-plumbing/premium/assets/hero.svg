<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2436"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E415D"/>
      <stop offset=".45" stop-color="#3C6C92"/>
      <stop offset="1" stop-color="#16324A"/>
    </linearGradient>
    <linearGradient id="pipeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E415D"/>
      <stop offset=".45" stop-color="#3C6C92"/>
      <stop offset="1" stop-color="#16324A"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58B4F"/>
      <stop offset="1" stop-color="#E1560F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F26722" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F26722" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#142E44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="880" height="660" fill="url(#bg)"/>
  <rect width="880" height="660" fill="url(#grid)" opacity=".6"/>
  <circle cx="590" cy="250" r="210" fill="url(#glow)"/>
  <!-- schematic pipe runs -->
  <rect x="-20" y="486" width="920" height="26" rx="13" fill="url(#pipe)"/>
  <rect x="577" y="120" width="26" height="380" rx="13" fill="url(#pipeV)"/>
  <rect x="150" y="486" width="26" height="200" rx="13" fill="url(#pipeV)"/>
  <circle cx="590" cy="499" r="26" fill="#16324A" stroke="#9FC2DC" stroke-width="2"/>
  <circle cx="590" cy="499" r="10" fill="none" stroke="#9FC2DC" stroke-width="2"/>
  <circle cx="163" cy="499" r="22" fill="#16324A" stroke="#5E86A8" stroke-width="2"/>
  <!-- inline valve on horizontal run -->
  <path d="M330 480l38 19-38 19zM406 480l-38 19 38 19z" fill="#0A1B2A" stroke="#9FC2DC" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="364" y="452" width="8" height="30" rx="3" fill="#F26722"/>
  <rect x="348" y="446" width="40" height="9" rx="4.5" fill="#F26722"/>

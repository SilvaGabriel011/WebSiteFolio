  <path d="M60 420h34M118 420h18M700 560h34M758 560h18M660 92h30" stroke="#F26722" stroke-width="3" stroke-linecap="round"/>
  <circle cx="778" cy="160" r="5" fill="none" stroke="#5E86A8" stroke-width="2"/>
  <circle cx="812" cy="132" r="3" fill="#5E86A8"/>
  <circle cx="96" cy="560" r="4" fill="none" stroke="#5E86A8" stroke-width="2"/>

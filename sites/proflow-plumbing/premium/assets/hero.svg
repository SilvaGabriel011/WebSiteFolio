  <circle cx="590" cy="250" r="128" fill="#0A1B2A" stroke="#9FC2DC" stroke-width="3"/>
  <circle cx="590" cy="250" r="106" fill="none" stroke="#3C6C92" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M590 250m-88 0a88 88 0 0 1 62-84" fill="none" stroke="#F26722" stroke-width="7" stroke-linecap="round"/>
  <path d="M590 250 528 187" stroke="#F58B4F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="590" cy="250" r="12" fill="#F26722"/>
  <circle cx="590" cy="250" r="4.5" fill="#0A1B2A"/>
  <path d="M590 122v-14M718 250h14M590 378v14M462 250h-14" stroke="#5E86A8" stroke-width="3" stroke-linecap="round"/>
  <!-- droplet cluster -->
  <path d="M228 218c46 58 78 100 78 143a78 78 0 1 1-156 0c0-43 32-85 78-143z" fill="url(#drop)"/>

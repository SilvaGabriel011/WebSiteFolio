<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2134"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <pattern id="ribs" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect width="26" height="10" fill="#1E415D"/>
      <rect width="13" height="10" fill="#16324A"/>
      <path d="M13 0v10" stroke="#2C567A" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="rdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58B4F"/>
      <stop offset="1" stop-color="#E1560F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#rbg)"/>
  <!-- rain -->
  <path d="M120 60l-10 26M200 40l-10 26M290 70l-10 26M380 36l-10 26M470 64l-10 26M560 40l-10 26M650 70l-10 26M730 44l-10 26" stroke="#3C6C92" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 130l-8 22M330 140l-8 22M500 128l-8 22M690 136l-8 22" stroke="#5E86A8" stroke-width="3" stroke-linecap="round"/>
  <!-- hill line -->
  <path d="M0 520c140-50 300-64 420-40s260 44 380 30v90H0z" fill="#0A1B2A"/>
  <!-- corrugated tank -->
  <rect x="90" y="230" width="270" height="270" rx="14" fill="url(#ribs)" stroke="#5E86A8" stroke-width="3"/>
  <ellipse cx="225" cy="230" rx="135" ry="26" fill="#2C567A" stroke="#7FA8C9" stroke-width="3"/>
  <path d="M96 330h258M96 424h258" stroke="#0A1B2A" stroke-width="3" opacity=".6"/>
  <!-- inlet with first-flush diverter -->
  <path d="M225 168v40" stroke="#5E86A8" stroke-width="12" stroke-linecap="round"/>
  <path d="M225 168h150" stroke="#5E86A8" stroke-width="10" stroke-linecap="round"/>
  <path d="M375 168v90" stroke="#5E86A8" stroke-width="10" stroke-linecap="round"/>
  <path d="M375 274c6 8 11 15 11 20a11 11 0 1 1-22 0c0-5 5-12 11-20z" fill="#7FA8C9"/>
  <!-- level gauge -->
  <rect x="112" y="270" width="14" height="210" rx="7" fill="#0A1B2A" stroke="#5E86A8" stroke-width="2"/>
  <rect x="116" y="330" width="6" height="146" rx="3" fill="#F26722"/>
  <!-- pump -->
  <rect x="420" y="430" width="120" height="70" rx="14" fill="#0F2A40" stroke="#9FC2DC" stroke-width="3"/>
  <circle cx="458" cy="465" r="22" fill="#0A1B2A" stroke="#F26722" stroke-width="4"/>
  <path d="M458 465m-12 0a12 12 0 0 1 9-11" fill="none" stroke="#F58B4F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="458" cy="465" r="4" fill="#F26722"/>
  <rect x="494" y="450" width="32" height="30" rx="6" fill="#16324A" stroke="#5E86A8" stroke-width="2"/>
  <!-- feed tank -> pump -> house -->
  <path d="M360 462h56" stroke="#3C6C92" stroke-width="12" stroke-linecap="round"/>
  <path d="M540 462h80V330h80" fill="none" stroke="url(#rdrop)" stroke-width="12" stroke-linecap="round"/>
  <!-- house outline -->
  <path d="M660 330l80-64 60 48" fill="none" stroke="#9FC2DC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M676 322v120h130V318" fill="none" stroke="#9FC2DC" stroke-width="4" stroke-linecap="round"/>
  <rect x="712" y="380" width="34" height="62" fill="none" stroke="#5E86A8" stroke-width="3"/>
  <circle cx="770" cy="366" r="12" fill="none" stroke="#F58B4F" stroke-width="3"/>
  <!-- garden tap -->
  <path d="M600 500v-20h24" fill="none" stroke="#7FA8C9" stroke-width="6" stroke-linecap="round"/>
  <path d="M624 486c4 6 7 10 7 14a7 7 0 1 1-14 0c0-4 3-8 7-14z" fill="#F26722"/>
</svg>

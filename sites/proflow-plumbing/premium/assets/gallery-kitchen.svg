<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2436"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <pattern id="ktile" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#0F2A40"/>
      <path d="M0 0h64M0 32h64M32 0v32" stroke="#1C3A52" stroke-width="2"/>
      <path d="M0 0v32M64 0v32" stroke="#1C3A52" stroke-width="1"/>
    </pattern>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C6C92"/>
      <stop offset="1" stop-color="#1E415D"/>
    </linearGradient>
    <linearGradient id="khot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58B4F"/>
      <stop offset="1" stop-color="#E1560F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#kbg)"/>
  <!-- splashback -->
  <rect x="60" y="60" width="680" height="180" fill="url(#ktile)"/>
  <rect x="60" y="60" width="680" height="180" fill="none" stroke="#3C6C92" stroke-width="2"/>
  <!-- benchtop -->
  <rect x="20" y="240" width="760" height="26" rx="6" fill="url(#bench)"/>
  <!-- sink bowl -->
  <path d="M290 266v16a30 30 0 0 0 30 30h160a30 30 0 0 0 30-30v-16" fill="none" stroke="#9FC2DC" stroke-width="5" stroke-linecap="round"/>
  <!-- mixer tap -->
  <path d="M400 240v-70a46 46 0 0 0-46-46" fill="none" stroke="#9FC2DC" stroke-width="10" stroke-linecap="round"/>
  <path d="M354 124v-14" stroke="#9FC2DC" stroke-width="10" stroke-linecap="round"/>
  <rect x="334" y="98" width="40" height="12" rx="6" fill="#F26722"/>
  <path d="M354 132c5 7 9 13 9 18a9 9 0 1 1-18 0c0-5 4-11 9-18z" fill="#7FA8C9"/>
  <!-- P-trap -->
  <path d="M385 312v70a34 34 0 0 0 34 34 34 34 0 0 0 34-34v-16" fill="none" stroke="#3C6C92" stroke-width="18" stroke-linecap="round"/>
  <path d="M453 366h60" stroke="#3C6C92" stroke-width="18" stroke-linecap="round"/>
  <!-- hot / cold supply lines -->
  <path d="M330 540V420a24 24 0 0 1 24-24h14" fill="none" stroke="url(#khot)" stroke-width="12" stroke-linecap="round"/>
  <path d="M470 540V430a24 24 0 0 0-24-24h-14" fill="none" stroke="#3C6C92" stroke-width="12" stroke-linecap="round"/>
  <circle cx="330" cy="470" r="14" fill="#0A1B2A" stroke="#F26722" stroke-width="3"/>
  <path d="M323 470h14" stroke="#F26722" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="470" r="14" fill="#0A1B2A" stroke="#7FA8C9" stroke-width="3"/>
  <path d="M463 470h14M470 463v14" stroke="#7FA8C9" stroke-width="3" stroke-linecap="round"/>
  <!-- island run to cooktop gas -->
  <path d="M620 540V330" stroke="#5E86A8" stroke-width="10" stroke-linecap="round"/>
  <path d="M602 330l18-30 18 30z" fill="#0A1B2A" stroke="#F26722" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="620" cy="282" r="12" fill="none" stroke="#F58B4F" stroke-width="3"/>
  <path d="M620 274c3 4 5 7 5 10a5 5 0 1 1-10 0c0-3 2-6 5-10z" fill="#F26722"/>
  <!-- cabinetry lines -->
  <rect x="60" y="300" width="180" height="240" rx="8" fill="none" stroke="#1C3A52" stroke-width="3"/>
  <path d="M150 300v240M60 420h180" stroke="#1C3A52" stroke-width="2"/>
  <circle cx="132" cy="360" r="4" fill="#3C6C92"/>
  <circle cx="168" cy="360" r="4" fill="#3C6C92"/>
  <!-- floor -->
  <rect y="540" width="800" height="60" fill="#0A1B2A"/>
  <path d="M0 540h800" stroke="#1C3A52" stroke-width="2"/>
  <!-- pendant dots -->
  <path d="M180 60v60M700 60v40" stroke="#1C3A52" stroke-width="3"/>
  <circle cx="180" cy="130" r="9" fill="none" stroke="#F58B4F" stroke-width="3"/>
  <circle cx="700" cy="110" r="9" fill="none" stroke="#F58B4F" stroke-width="3"/>
</svg>

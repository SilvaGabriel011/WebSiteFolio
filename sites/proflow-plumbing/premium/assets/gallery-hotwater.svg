<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2436"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12293D"/>
      <stop offset=".35" stop-color="#3C6C92"/>
      <stop offset=".6" stop-color="#1E415D"/>
      <stop offset="1" stop-color="#0F2233"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58B4F"/>
      <stop offset="1" stop-color="#E1560F"/>
    </linearGradient>
    <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#12293D" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#hbg)"/>
  <rect width="800" height="600" fill="url(#hgrid)" opacity=".7"/>
  <!-- plinth -->
  <rect x="230" y="520" width="340" height="22" rx="6" fill="#0A1B2A" stroke="#1C3A52" stroke-width="2"/>
  <!-- cylinder -->
  <rect x="270" y="120" width="260" height="404" rx="56" fill="url(#tank)" stroke="#5E86A8" stroke-width="2.5"/>
  <path d="M290 180h220M290 300h220M290 420h220" stroke="#0A1B2A" stroke-width="4" opacity=".55"/>
  <ellipse cx="400" cy="140" rx="108" ry="26" fill="#1E415D" stroke="#5E86A8" stroke-width="2"/>
  <!-- hot outlet (orange) and cold inlet (blue) -->
  <path d="M400 114V64h210" fill="none" stroke="url(#hot)" stroke-width="18" stroke-linecap="round"/>
  <path d="M530 340h130v170" fill="none" stroke="#3C6C92" stroke-width="16" stroke-linecap="round"/>
  <circle cx="660" cy="340" r="17" fill="#0A1B2A" stroke="#7FA8C9" stroke-width="2.5"/>
  <path d="M652 340h16M660 332v16" stroke="#7FA8C9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- relief valve drip -->
  <path d="M270 220h-74v210" fill="none" stroke="#5E86A8" stroke-width="10" stroke-linecap="round"/>
  <path d="M196 470c8 10 13 18 13 25a13 13 0 1 1-26 0c0-7 5-15 13-25z" fill="#F26722"/>
  <path d="M196 528c5 7 9 12 9 17a9 9 0 1 1-18 0c0-5 4-10 9-17z" fill="none" stroke="#F58B4F" stroke-width="2.5"/>
  <!-- thermostat dial -->
  <circle cx="400" cy="330" r="58" fill="#0A1B2A" stroke="#9FC2DC" stroke-width="3"/>
  <circle cx="400" cy="330" r="44" fill="none" stroke="#3C6C92" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M400 330m-36 0a36 36 0 0 1 26-34" fill="none" stroke="#F26722" stroke-width="6" stroke-linecap="round"/>
  <path d="M400 330 376 306" stroke="#F58B4F" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="400" cy="330" r="7" fill="#F26722"/>
  <!-- element cover + anode marker -->
  <rect x="356" y="452" width="88" height="34" rx="9" fill="#0A1B2A" stroke="#5E86A8" stroke-width="2"/>
  <circle cx="378" cy="469" r="5" fill="#7FA8C9"/>
  <circle cx="422" cy="469" r="5" fill="#7FA8C9"/>
  <!-- heat shimmer -->
  <path d="M660 96c10-12 22-12 32 0M652 128c14-16 34-16 48 0" fill="none" stroke="#F58B4F" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- old tank ghost -->
  <rect x="84" y="330" width="96" height="192" rx="28" fill="none" stroke="#1C3A52" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M104 402l56 56M160 402l-56 56" stroke="#1C3A52" stroke-width="3" stroke-linecap="round"/>
</svg>

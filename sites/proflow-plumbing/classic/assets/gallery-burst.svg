<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082A4A"/>
      <stop offset="1" stop-color="#0B3E6B"/>
    </linearGradient>
    <clipPath id="nframe"><rect x="8" y="8" width="424" height="304" rx="10"/></clipPath>
  </defs>
  <rect x="8" y="8" width="424" height="304" rx="10" fill="url(#night)"/>
  <g clip-path="url(#nframe)">
    <!-- moon & stars -->
    <circle cx="368" cy="66" r="30" fill="#EAF2F9"/>
    <circle cx="356" cy="58" r="26" fill="#0A3560"/>
    <g fill="#9FC2DC">
      <circle cx="70" cy="50" r="2.6"/>
      <circle cx="130" cy="86" r="2"/>
      <circle cx="230" cy="44" r="2.6"/>
      <circle cx="300" cy="98" r="2"/>
      <circle cx="180" cy="66" r="1.8"/>
    </g>

    <!-- ground / trench -->
    <rect x="8" y="238" width="424" height="74" fill="#062038"/>
    <path d="M8 238h140l24 22h96l24-22h140" fill="none" stroke="#2B6FAD" stroke-width="4"/>

    <!-- broken pipe with jagged split -->
    <path d="M8 210h150l16-14 8 22 10-18 6 14" fill="none" stroke="#9FC2DC" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M432 210H262l-16 16-8-24-10 20-6-12" fill="none" stroke="#9FC2DC" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- water spraying up -->
    <g fill="#5E93C2">
      <path d="M212 160c7 9 12 15 12 21a12 12 0 1 1-24 0c0-6 5-12 12-21z"/>
      <path d="M186 128c5.6 7 9.6 12 9.6 17a9.6 9.6 0 1 1-19.2 0c0-5 4-10 9.6-17z" opacity=".85"/>
      <path d="M243 120c5.6 7 9.6 12 9.6 17a9.6 9.6 0 1 1-19.2 0c0-5 4-10 9.6-17z" opacity=".85"/>
      <path d="M218 92c4.4 5.5 7.6 9.5 7.6 13.4a7.6 7.6 0 1 1-15.2 0c0-3.9 3.2-7.9 7.6-13.4z" opacity=".65"/>
      <circle cx="172" cy="158" r="4.4"/>
      <circle cx="262" cy="150" r="4.4"/>
      <circle cx="200" cy="112" r="3.2" opacity=".7"/>
      <circle cx="240" cy="160" r="3.2"/>
    </g>

    <!-- repair clamp, torch beam & spanner -->
    <rect x="196" y="196" width="50" height="30" rx="7" fill="#F26722"/>
    <rect x="206" y="190" width="8" height="42" rx="3" fill="#C24E0F"/>
    <rect x="228" y="190" width="8" height="42" rx="3" fill="#C24E0F"/>

    <path d="M60 120l70 74" stroke="#F5B98A" stroke-width="26" stroke-linecap="round" opacity=".22"/>
    <g transform="translate(52 108) rotate(40)">
      <rect x="-9" y="-2" width="18" height="34" rx="6" fill="#F26722"/>
      <rect x="-11" y="-12" width="22" height="12" rx="4" fill="#C24E0F"/>
    </g>

    <g transform="translate(330 262) rotate(-18)">
      <rect x="-38" y="-5" width="76" height="10" rx="5" fill="#9FC2DC"/>
      <circle cx="-44" cy="0" r="13" fill="#9FC2DC"/>
      <circle cx="-44" cy="-7" r="6.5" fill="#062038"/>
      <circle cx="46" cy="0" r="10" fill="#9FC2DC"/>
      <circle cx="46" cy="6" r="5" fill="#062038"/>
    </g>
  </g>
  <rect x="8" y="8" width="424" height="304" rx="10" fill="none" stroke="#0B4F8A" stroke-width="2.5"/>
</svg>

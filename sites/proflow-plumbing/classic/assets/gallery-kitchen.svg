<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <defs>
    <pattern id="splash" width="34" height="17" patternUnits="userSpaceOnUse">
      <rect width="34" height="17" fill="#E3EDF5"/>
      <path d="M0 .5H34M17 0V17M0 16.5H34" stroke="#C3D6E6" stroke-width="1.4"/>
    </pattern>
    <clipPath id="cframe"><rect x="8" y="8" width="424" height="304" rx="10"/></clipPath>
  </defs>
  <rect x="8" y="8" width="424" height="304" rx="10" fill="#FBF8F2"/>
  <g clip-path="url(#cframe)">
    <!-- splashback -->
    <rect x="8" y="8" width="424" height="132" fill="url(#splash)"/>

    <!-- benchtop -->
    <rect x="8" y="140" width="424" height="18" fill="#0B4F8A"/>
    <rect x="8" y="140" width="424" height="5" fill="#2B6FAD"/>

    <!-- sink bowl -->
    <rect x="150" y="158" width="150" height="52" rx="10" fill="#DCE4EA" stroke="#0B4F8A" stroke-width="4"/>
    <circle cx="225" cy="196" r="7" fill="#083A63"/>

    <!-- gooseneck tap -->
    <path d="M225 138v-52a34 34 0 0 1 34 -34h6a30 30 0 0 1 30 30v10" fill="none" stroke="#0B4F8A" stroke-width="10" stroke-linecap="round"/>
    <rect x="286" y="92" width="18" height="14" rx="4" fill="#083A63"/>
    <rect x="210" y="128" width="30" height="12" rx="4" fill="#083A63"/>
    <path d="M295 118c4.4 5.5 7.6 9.5 7.6 13.4a7.6 7.6 0 1 1-15.2 0c0-3.9 3.2-7.9 7.6-13.4z" fill="#F26722"/>

    <!-- cabinet carcass under bench -->
    <path d="M60 158v130M380 158v130" stroke="#C9B99A" stroke-width="5"/>
    <path d="M60 288h320" stroke="#C9B99A" stroke-width="5" stroke-linecap="round"/>

    <!-- P-trap and branch lines -->
    <path d="M225 210v34a20 20 0 0 1-40 0 20 20 0 0 0-40 0v18" fill="none" stroke="#0B4F8A" stroke-width="9" stroke-linecap="round"/>
    <path d="M232 236h72" stroke="#F26722" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 13"/>
    <!-- dishwasher point -->
    <rect x="304" y="222" width="46" height="42" rx="6" fill="none" stroke="#F26722" stroke-width="5"/>
    <circle cx="327" cy="243" r="9" fill="none" stroke="#F26722" stroke-width="4"/>

    <!-- isolation cocks -->
    <g fill="#C24E0F">
      <rect x="138" y="252" width="16" height="8" rx="3"/>
      <rect x="218" y="222" width="16" height="8" rx="3" transform="rotate(90 226 226)"/>
    </g>

    <!-- droplet accents in splash zone -->
    <path d="M96 62c7 9 12 15 12 21a12 12 0 1 1-24 0c0-6 5-12 12-21z" fill="#0B4F8A" opacity=".8"/>
    <path d="M132 92c5 6.5 8.6 11 8.6 15.4a8.6 8.6 0 1 1-17.2 0c0-4.4 3.6-8.9 8.6-15.4z" fill="#F26722"/>
    <circle cx="360" cy="60" r="5" fill="#0B4F8A" opacity=".35"/>
    <circle cx="390" cy="88" r="3.6" fill="#F26722" opacity=".6"/>
  </g>
  <rect x="8" y="8" width="424" height="304" rx="10" fill="none" stroke="#0B4F8A" stroke-width="2.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="grwT">
  <title id="grwT">Corrugated rainwater tank with pump and pipe run to the house</title>
  <defs>
    <linearGradient id="grwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E4A80"/>
      <stop offset="1" stop-color="#062741"/>
    </linearGradient>
    <linearGradient id="grwCorr" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat" gradientUnits="userSpaceOnUse" gradientTransform="scale(16 1)">
      <stop offset="0" stop-color="#155C96"/>
      <stop offset="0.5" stop-color="#5FA8DC"/>
      <stop offset="1" stop-color="#155C96"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grwBg)"/>
  <!-- rain -->
  <g stroke="#5FA8DC" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M70 34 l-6 18"/><path d="M110 22 l-6 18"/><path d="M150 38 l-6 18"/>
    <path d="M196 24 l-6 18"/><path d="M240 40 l-6 18"/><path d="M284 26 l-6 18"/>
  </g>
  <!-- ground -->
  <rect y="256" width="400" height="44" fill="#041C30"/>
  <!-- house gable + downpipe -->
  <g>
    <path d="M256 148 L322 96 L388 148 Z" fill="#0A3A64"/>
    <rect x="272" y="148" width="100" height="108" fill="#0A3055"/>
    <rect x="306" y="196" width="32" height="60" fill="#062741"/>
    <path d="M388 148 v96" stroke="#F26722" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- tank -->
  <g transform="translate(52 118)">
    <rect width="150" height="138" rx="10" fill="url(#grwCorr)"/>
    <rect width="150" height="16" rx="8" fill="#0A3A64"/>
    <rect x="60" y="-14" width="30" height="14" rx="5" fill="#F26722"/>
    <!-- water level window -->
    <rect x="120" y="30" width="14" height="92" rx="7" fill="#062741"/>
    <rect x="120" y="66" width="14" height="56" rx="7" fill="#5FA8DC"/>
  </g>
  <!-- pump -->
  <g transform="translate(232 226)">
    <rect x="-22" y="-12" width="44" height="30" rx="6" fill="#0A3A64" stroke="#7FB4DE" stroke-width="4"/>
    <circle cx="0" cy="-24" r="13" fill="#062741" stroke="#F26722" stroke-width="4"/>
    <path d="M0 -24 L7 -31" stroke="#F26722" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- pipe run tank -> pump -> house -->
  <g fill="none" stroke="#F26722" stroke-width="9" stroke-linecap="round">
    <path d="M202 232 h8"/>
    <path d="M254 232 h18 q10 0 10 -10 v-12"/>
  </g>
  <path d="M282 196 v14" stroke="#F26722" stroke-width="9" stroke-linecap="round"/>
  <!-- droplet badge -->
  <g transform="translate(127 186)">
    <circle r="26" fill="#0A3A64"/>
    <path d="M0 -17 c8 11 14 17 14 25 a14 14 0 1 1 -28 0 c0 -8 6 -14 14 -25z" fill="#5FA8DC"/>
  </g>
</svg>

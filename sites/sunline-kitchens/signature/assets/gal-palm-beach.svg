<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-label="">
  <defs>
    <linearGradient id="pbstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF7"/><stop offset="1" stop-color="#EFE9DA"/>
    </linearGradient>
    <pattern id="pbtile" width="64" height="28" patternUnits="userSpaceOnUse">
      <rect width="64" height="28" fill="#F9F4E6"/>
      <path d="M0 27.2h64M31.2 0v13.2M63.2 14v13.2" stroke="#E7DEC8" stroke-width="1.6"/>
      <path d="M0 13.2h64" stroke="#E7DEC8" stroke-width="1.6"/>
    </pattern>
    <radialGradient id="pbsun" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#E9C87F"/><stop offset="1" stop-color="#C99F53"/>
    </radialGradient>
  </defs>
  <rect width="840" height="560" fill="#FBF8F1"/>
  <rect y="428" width="840" height="132" fill="#F0E7D2"/>
  <path d="M0 470h840M0 516h840" stroke="#E3D8BD" stroke-width="2"/>

  <!-- window to the sea -->
  <rect x="540" y="64" width="248" height="364" fill="#F7EFDC"/>
  <rect x="552" y="76" width="224" height="340" fill="#F8F1DF"/>
  <rect x="552" y="252" width="224" height="58" fill="#9FBCA6"/>
  <path d="M552 268h224M552 286h224" stroke="#8FAE97" stroke-width="2" opacity=".7"/>
  <rect x="552" y="310" width="224" height="106" fill="#EBDFC2"/>
  <circle cx="664" cy="170" r="40" fill="url(#pbsun)"/>
  <rect x="540" y="64" width="248" height="364" fill="none" stroke="#B58B3E" stroke-width="2.5"/>
  <path d="M664 76v340" stroke="#B58B3E" stroke-width="1.8" opacity=".5"/>

  <!-- white shaker uppers -->
  <rect x="52" y="70" width="452" height="128" fill="#FDFBF4"/>
  <g fill="none" stroke="#E3DAC4" stroke-width="2.5">
    <rect x="68" y="84" width="122" height="100" rx="2"/>
    <rect x="216" y="84" width="122" height="100" rx="2"/>
    <rect x="364" y="84" width="122" height="100" rx="2"/>
    <rect x="84" y="100" width="90" height="68"/>
    <rect x="232" y="100" width="90" height="68"/>
    <rect x="380" y="100" width="90" height="68"/>
  </g>
  <g stroke="#B58B3E" stroke-width="3.5" stroke-linecap="round">
    <path d="M116 190h24M264 190h24M412 190h24"/>
  </g>

  <!-- splashback + bench -->
  <rect x="52" y="214" width="452" height="120" fill="url(#pbtile)"/>
  <rect x="44" y="330" width="468" height="18" rx="3" fill="url(#pbstone)"/>
  <rect x="52" y="348" width="452" height="106" fill="#FDFBF4"/>
  <path d="M165 348v106M278 348v106M391 348v106" stroke="#E3DAC4" stroke-width="2.5"/>
  <g stroke="#B58B3E" stroke-width="3.5" stroke-linecap="round">
    <path d="M92 368h30M205 368h30M318 368h30M431 368h30"/>
  </g>

  <!-- pale sage island -->
  <ellipse cx="330" cy="516" rx="270" ry="18" fill="#26312B" opacity=".08"/>
  <rect x="106" y="426" width="448" height="82" fill="#B7C9B4"/>
  <path d="M218 426v82M442 426v82" stroke="#A2B8A0" stroke-width="2.5"/>
  <rect x="88" y="404" width="484" height="24" rx="4" fill="url(#pbstone)"/>
  <path d="M120 420c46 8 74-14 118-8s70 22 110 14" fill="none" stroke="#DAD2BE" stroke-width="2" opacity=".8"/>

  <!-- pendant -->
  <path d="M330 0v168" stroke="#8A6528" stroke-width="2.5"/>
  <path d="M296 202a34 34 0 0 1 68 0z" fill="url(#pbsun)"/>
  <ellipse cx="330" cy="205" rx="24" ry="5" fill="#E9C87F" opacity=".5"/>

  <!-- sprig on island -->
  <path d="M508 404v-26m0 6c-7-7-14-9-21-7m21 1c7-7 14-9 21-7" fill="none" stroke="#87A48A" stroke-width="3" stroke-linecap="round"/>

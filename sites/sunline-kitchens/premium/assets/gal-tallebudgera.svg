<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-label="">
  <defs>
    <linearGradient id="tbstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF7"/><stop offset="1" stop-color="#EEE8D8"/>
    </linearGradient>
    <radialGradient id="tbsun" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#E9C87F"/><stop offset="1" stop-color="#C79C4E"/>
    </radialGradient>
  </defs>
  <rect width="840" height="560" fill="#FBF8F1"/>

  <!-- outdoors: warm evening sky through the opening -->
  <rect x="416" y="52" width="368" height="404" fill="#F7EBD2"/>
  <circle cx="600" cy="180" r="52" fill="url(#tbsun)"/>
  <rect x="416" y="330" width="368" height="126" fill="#E2D3AF"/>
  <path d="M416 372h368M416 414h368" stroke="#D2C094" stroke-width="2.4"/>

  <!-- palms -->
  <g fill="none" stroke="#6E8D74" stroke-width="4" stroke-linecap="round">
    <path d="M700 330c6-60 2-104-10-138"/>
    <path d="M690 192c-20-18-44-24-64-18M690 192c2-26-6-46-22-58M690 192c22-14 46-14 62-4M690 192c26-4 46 8 56 26"/>
  </g>
  <g fill="none" stroke="#87A48A" stroke-width="3" stroke-linecap="round">
    <path d="M762 330c4-40 2-70-6-94"/>
    <path d="M756 236c-14-12-30-16-44-12M756 236c0-18-6-32-16-40M756 236c16-10 32-10 44-2"/>
  </g>

  <!-- bifold frames stacked open at the right -->
  <g stroke="#B58B3E" stroke-width="3" fill="none">
    <rect x="416" y="52" width="368" height="404"/>
    <path d="M742 60l22 388M764 56l14 396"/>
  </g>

  <!-- interior cabinetry, left -->
  <rect x="52" y="96" width="330" height="112" fill="#87A48A"/>
  <g fill="none" stroke="#6E8D74" stroke-width="2.5">
    <rect x="66" y="110" width="140" height="84" rx="2"/>
    <rect x="222" y="110" width="146" height="84" rx="2"/>
  </g>
  <path d="M128 200h28M286 200h28" stroke="#D9B36A" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="52" y="224" width="330" height="80" fill="#F8F2E4"/>
  <path d="M52 252h330M52 280h330" stroke="#E7DEC8" stroke-width="1.8"/>

  <!-- one long servery bench flowing inside to out -->
  <rect x="44" y="304" width="756" height="22" rx="4" fill="url(#tbstone)"/>
  <path d="M90 318c52 8 82-14 132-8s78 20 122 14 84-18 128-12 92 16 132 10" fill="none" stroke="#DAD2BE" stroke-width="2.2"/>
  <rect x="52" y="326" width="330" height="130" fill="#5F7A63"/>
  <path d="M162 326v130M272 326v130" stroke="#4E6852" stroke-width="2.5"/>
  <g stroke="#D9B36A" stroke-width="3.8" stroke-linecap="round">
    <path d="M84 348h36M194 348h36M304 348h36"/>
  </g>
  <!-- outdoor side of servery: slatted base + stools -->
  <rect x="452" y="326" width="240" height="60" fill="#7E9B81"/>
  <path d="M452 340h240M452 354h240M452 368h240" stroke="#6E8D74" stroke-width="2.4"/>
  <g>
    <ellipse cx="510" cy="404" rx="24" ry="8" fill="#B58B3E"/>
    <path d="M494 410l-7 46M526 410l7 46" stroke="#8A6528" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="610" cy="404" rx="24" ry="8" fill="#B58B3E"/>
    <path d="M594 410l-7 46M626 410l7 46" stroke="#8A6528" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floors: boards in, deck out -->
  <rect y="456" width="840" height="104" fill="#EFE6D0"/>
  <path d="M0 456h840" stroke="#DDD0B2" stroke-width="3"/>
  <path d="M0 500h416M0 534h416" stroke="#E2D6BA" stroke-width="2"/>
  <path d="M436 480l404 10M436 512l404 16M436 542l404 14" stroke="#D9C9A2" stroke-width="2.4"/>

  <!-- pendant over the servery -->
  <path d="M258 0v230" stroke="#8A6528" stroke-width="2.5"/>
  <path d="M226 264a32 32 0 0 1 64 0z" fill="url(#tbsun)"/>
  <ellipse cx="258" cy="267" rx="22" ry="5" fill="#E9C87F" opacity=".5"/>
</svg>

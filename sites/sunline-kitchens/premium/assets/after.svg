  <path d="M110 344c48 6 76-12 120-7s70 16 108 11 76-14 112-9" fill="none" stroke="#DAD2BE" stroke-width="2.2"/>
  <path d="M66 349h510" stroke="#DDD2B8" stroke-width="2"/>


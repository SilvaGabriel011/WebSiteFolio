<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="gcbT">
  <title id="gcbT">Stylised Hamptons-style kitchen with deep blue shaker cabinetry, glass-front overheads and classic brass pendants</title>
  <defs>
    <linearGradient id="cbStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EDE8DC"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cbGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2CE82" stop-opacity=".8"/><stop offset="1" stop-color="#F2CE82" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cbVJ" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect width="26" height="10" fill="#F4F1E6"/>
      <path d="M13 0v10" stroke="#DED8C2" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="14" fill="#FAF7EE"/>
  <!-- VJ panelled wall -->
  <rect x="0" y="0" width="800" height="392" fill="url(#cbVJ)"/>
  <!-- classic dome pendants -->
  <g>
    <path d="M250 0v78M550 0v78" stroke="#233B4E" stroke-width="4"/>
    <path d="M218 110a32 32 0 0 1 64 0z" fill="#C9974C" stroke="#233B4E" stroke-width="4" transform="rotate(180 250 94)"/>
    <path d="M518 110a32 32 0 0 1 64 0z" fill="#C9974C" stroke="#233B4E" stroke-width="4" transform="rotate(180 550 94)"/>
    <ellipse cx="250" cy="122" rx="28" ry="13" fill="url(#cbGlow)"/>
    <ellipse cx="550" cy="122" rx="28" ry="13" fill="url(#cbGlow)"/>
    <circle cx="250" cy="112" r="5" fill="#EFC46E"/>
    <circle cx="550" cy="112" r="5" fill="#EFC46E"/>
  </g>
  <!-- glass-front overheads with mullions -->
  <g>
    <rect x="80" y="128" width="280" height="100" fill="#39566B"/>
    <g fill="#D7E4E2" stroke="#233B4E" stroke-width="4">
      <rect x="94" y="140" width="112" height="76" rx="3"/>
      <rect x="234" y="140" width="112" height="76" rx="3"/>
    </g>
    <g stroke="#233B4E" stroke-width="3">
      <path d="M150 140v76M94 178h112M290 140v76M234 178h112"/>
    </g>
    <rect x="80" y="128" width="280" height="100" fill="none" stroke="#233B4E" stroke-width="6"/>
  </g>
  <g>
    <rect x="440" y="128" width="280" height="100" fill="#39566B"/>
    <g fill="#D7E4E2" stroke="#233B4E" stroke-width="4">
      <rect x="454" y="140" width="112" height="76" rx="3"/>
      <rect x="594" y="140" width="112" height="76" rx="3"/>
    </g>
    <g stroke="#233B4E" stroke-width="3">
      <path d="M510 140v76M454 178h112M650 140v76M594 178h112"/>
    </g>
    <rect x="440" y="128" width="280" height="100" fill="none" stroke="#233B4E" stroke-width="6"/>
  </g>
  <!-- stone bench with thick classic edge -->
  <rect x="40" y="336" width="720" height="26" rx="6" fill="url(#cbStone)" stroke="#233B4E" stroke-width="6"/>
  <!-- deep blue shaker bases -->
  <g>
    <rect x="48" y="362" width="704" height="112" fill="#39566B"/>
    <g fill="none" stroke="#233B4E" stroke-width="4">
      <rect x="64" y="376" width="126" height="84" rx="3"/>
      <rect x="208" y="376" width="126" height="84" rx="3"/>
      <rect x="352" y="376" width="126" height="84" rx="3"/>
      <rect x="496" y="376" width="126" height="84" rx="3"/>
      <rect x="640" y="376" width="96" height="84" rx="3"/>
    </g>
    <g fill="#C9974C">
      <circle cx="176" cy="418" r="6"/>
      <circle cx="320" cy="418" r="6"/>
      <circle cx="464" cy="418" r="6"/>
      <circle cx="608" cy="418" r="6"/>
      <circle cx="688" cy="418" r="6"/>
    </g>
    <rect x="48" y="362" width="704" height="112" fill="none" stroke="#233B4E" stroke-width="6"/>
  </g>
  <!-- farmhouse sink + tap -->
  <g>
    <rect x="330" y="318" width="140" height="22" rx="4" fill="#FDFDF8" stroke="#233B4E" stroke-width="5"/>
    <path d="M400 318v-34q0-16 18-16t18 14" stroke="#C9974C" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- herringbone-ish floor -->
  <rect x="0" y="474" width="800" height="86" fill="#EAD9B4"/>
  <g stroke="#D6BF92" stroke-width="3">
    <path d="M0 474l40 40M80 474l40 40M160 474l40 40M240 474l40 40M320 474l40 40M400 474l40 40M480 474l40 40M560 474l40 40M640 474l40 40M720 474l40 40"/>
    <path d="M40 474L0 514M120 474l-40 40M200 474l-40 40M280 474l-40 40M360 474l-40 40M440 474l-40 40M520 474l-40 40M600 474l-40 40M680 474l-40 40M760 474l-40 40"/>
  </g>
  <rect x="3" y="3" width="794" height="554" rx="12" fill="none" stroke="#233B4E" stroke-width="6"/>
</svg>

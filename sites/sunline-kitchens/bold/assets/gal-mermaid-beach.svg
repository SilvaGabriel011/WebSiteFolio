<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="gmbT">
  <title id="gmbT">Stylised luxe kitchen with charcoal-green fluted cabinetry, a veined marble island and three glowing brass pendants</title>
  <defs>
    <linearGradient id="mbMarble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F1EDE4"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mbGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2CE82" stop-opacity=".9"/><stop offset="1" stop-color="#F2CE82" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mbFlute" width="18" height="12" patternUnits="userSpaceOnUse">
      <rect width="18" height="12" fill="#26332C"/>
      <path d="M9 0v12" stroke="#39473F" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="14" fill="#141D18"/>
  <!-- fluted feature wall -->
  <rect x="0" y="0" width="800" height="392" fill="url(#mbFlute)"/>
  <!-- brass shelf with bottles -->
  <g>
    <path d="M540 128h200" stroke="#C9974C" stroke-width="6" stroke-linecap="round"/>
    <rect x="560" y="84" width="16" height="44" rx="6" fill="#5F7A63" stroke="#C9974C" stroke-width="3"/>
    <rect x="596" y="94" width="16" height="34" rx="6" fill="#8BA88E" stroke="#C9974C" stroke-width="3"/>
    <rect x="632" y="76" width="16" height="52" rx="6" fill="#39473F" stroke="#C9974C" stroke-width="3"/>
  </g>
  <!-- three brass dome pendants -->
  <g>
    <path d="M220 0v96M400 0v96M580 0v220" stroke="#C9974C" stroke-width="3"/>
    <path d="M188 128a32 32 0 0 1 64 0z" fill="#C9974C" transform="rotate(180 220 112)"/>
    <path d="M368 128a32 32 0 0 1 64 0z" fill="#C9974C" transform="rotate(180 400 112)"/>
    <circle cx="580" cy="232" r="14" fill="#EFC46E" stroke="#C9974C" stroke-width="4"/>
    <ellipse cx="220" cy="142" rx="30" ry="14" fill="url(#mbGlow)"/>
    <ellipse cx="400" cy="142" rx="30" ry="14" fill="url(#mbGlow)"/>
    <circle cx="220" cy="130" r="6" fill="#EFC46E"/>
    <circle cx="400" cy="130" r="6" fill="#EFC46E"/>
  </g>
  <!-- rear dark cabinetry with brass reveals -->
  <g>
    <rect x="48" y="252" width="704" height="110" fill="#26332C"/>
    <path d="M224 252v110M400 252v110M576 252v110" stroke="#141D18" stroke-width="4"/>
    <g stroke="#C9974C" stroke-width="4" stroke-linecap="round">
      <path d="M64 262h144M240 262h144M416 262h144M592 262h144"/>
    </g>
    <rect x="48" y="252" width="704" height="110" fill="none" stroke="#0C120E" stroke-width="6"/>
  </g>
  <!-- marble island with waterfall ends and bold veins -->
  <g>
    <rect x="150" y="392" width="500" height="130" rx="6" fill="url(#mbMarble)"/>
    <g stroke="#B9B2A2" stroke-width="4" fill="none" opacity=".9">
      <path d="M170 392q60 40 30 130"/>
      <path d="M300 392q90 50 60 130"/>
      <path d="M470 392q-40 60 20 130"/>
      <path d="M590 392q30 44 10 130"/>
    </g>
    <g stroke="#8F8878" stroke-width="2" fill="none" opacity=".8">
      <path d="M210 392q50 44 24 130M520 392q-24 56 12 130"/>
    </g>
    <rect x="150" y="392" width="500" height="130" rx="6" fill="none" stroke="#0C120E" stroke-width="7"/>
    <path d="M150 428h500" stroke="#0C120E" stroke-width="4" opacity=".35"/>
  </g>
  <!-- brass kick strip -->
  <path d="M166 522h468" stroke="#C9974C" stroke-width="6" stroke-linecap="round"/>
  <!-- dark stone floor -->
  <rect x="0" y="528" width="800" height="32" fill="#0C120E"/>
  <rect x="3" y="3" width="794" height="554" rx="12" fill="none" stroke="#C9974C" stroke-width="5"/>
</svg>

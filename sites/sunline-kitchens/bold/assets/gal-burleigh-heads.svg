    <rect x="508" y="386" width="70" height="16" rx="8" fill="#D9AC6F" stroke="#1C2620" stroke-width="5"/>
    <rect x="616" y="386" width="70" height="16" rx="8" fill="#D9AC6F" stroke="#1C2620" stroke-width="5"/>
  </g>
  <!-- floor -->
  <rect x="0" y="474" width="800" height="86" fill="#EFE7D2"/>
  <path d="M0 512h800" stroke="#DFD3B4" stroke-width="3"/>
  <rect x="3" y="3" width="794" height="554" rx="12" fill="none" stroke="#1C2620" stroke-width="6"/>
</svg>

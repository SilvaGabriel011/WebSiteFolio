<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Coastal white kitchen with sea-blue splashback and ocean view window">
  <defs>
    <linearGradient id="pbwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF2"/><stop offset="1" stop-color="#F3EEDF"/>
    </linearGradient>
    <pattern id="pbsub" width="56" height="32" patternUnits="userSpaceOnUse">
      <rect width="56" height="32" fill="#D5E7E5"/>
      <path d="M0 15.4h56M0 31.4h56" stroke="#B7D2CF" stroke-width="1.6"/>
      <path d="M28 0v15.4M0 16v15.4M56 16v15.4" stroke="#B7D2CF" stroke-width="1.6"/>
    </pattern>
    <pattern id="pbplank" width="150" height="22" patternUnits="userSpaceOnUse">
      <rect width="150" height="22" fill="#EBDDC2"/>
      <path d="M0 10.6h150M0 21.4h150" stroke="#D9C6A0" stroke-width="1.1"/>
      <path d="M44 0v10.6M116 11v11" stroke="#D9C6A0" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect width="800" height="404" fill="url(#pbwall)"/>
  <rect y="404" width="800" height="116" fill="url(#pbplank)"/>
  <path d="M0 404h800" stroke="#CBB88F" stroke-width="2"/>

  <!-- ocean window -->
  <rect x="256" y="52" width="288" height="172" rx="4" fill="#FDFCF6" stroke="#DCD4BD" stroke-width="3"/>
  <rect x="270" y="66" width="260" height="144" fill="#EAF4F2"/>
  <circle cx="330" cy="106" r="18" fill="#EFC878"/>
  <rect x="270" y="140" width="260" height="70" fill="#9EC4C0"/>
  <path d="M270 140h260" stroke="#7FA9A5" stroke-width="2"/>
  <path d="M284 162c14-5 28-5 42 0M348 178c14-5 28-5 42 0M446 158c14-5 28-5 42 0" stroke="#C5DCDA" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M400 66v144" stroke="#FDFCF6" stroke-width="6"/>

  <!-- overheads -->
  <g stroke-width="2">
    <rect x="56" y="52" width="168" height="106" rx="3" fill="#FCF9EF" stroke="#DCD4BD"/>
    <rect x="70" y="66" width="62" height="78" rx="2" fill="none" stroke="#DCD4BD"/>
    <rect x="150" y="66" width="62" height="78" rx="2" fill="none" stroke="#DCD4BD"/>
    <rect x="576" y="52" width="168" height="106" rx="3" fill="#FCF9EF" stroke="#DCD4BD"/>
    <rect x="590" y="66" width="62" height="78" rx="2" fill="none" stroke="#DCD4BD"/>
    <rect x="670" y="66" width="62" height="78" rx="2" fill="none" stroke="#DCD4BD"/>
  </g>
  <g fill="#C89B63">
    <circle cx="124" cy="136" r="3.4"/><circle cx="158" cy="136" r="3.4"/>
    <circle cx="644" cy="136" r="3.4"/><circle cx="678" cy="136" r="3.4"/>
  </g>

  <!-- rattan pendants -->
  <g fill="none" stroke="#C89B63" stroke-width="2.5">
    <path d="M330 0v206M470 0v206"/>
    <circle cx="330" cy="236" r="30"/>
    <circle cx="470" cy="236" r="30"/>
    <path d="M304 222c17 8 35 8 52 0M304 250c17-8 35-8 52 0M330 206v60"/>
    <path d="M444 222c17 8 35 8 52 0M444 250c17-8 35-8 52 0M470 206v60"/>
  </g>

  <!-- splashback + bench -->
  <rect x="56" y="228" width="688" height="64" fill="url(#pbsub)" stroke="#B7D2CF" stroke-width="2"/>
  <rect x="44" y="290" width="712" height="14" rx="2" fill="#FFFFFF" stroke="#D8D0B9" stroke-width="2"/>

  <!-- sink + tap -->
  <path d="M600 290v-24a13 13 0 0 1 13-13h9v8" fill="none" stroke="#C89B63" stroke-width="5" stroke-linecap="round"/>
  <rect x="566" y="288" width="96" height="5" rx="2" fill="#D8D0B9"/>

  <!-- plant -->
  <g>
    <path d="M116 262c-7-14-3-27 4-34 5 9 7 21 3 34" fill="#7E9B7F"/>
    <path d="M122 262c1-16 8-25 18-28-2 12-8 22-13 28" fill="#9DB79C"/>
    <path d="M108 290v-20a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v20z" fill="#9EC4C0"/>
  </g>

  <!-- base cabinets: white shaker -->
  <rect x="56" y="304" width="688" height="88" fill="#F6F2E5"/>
  <g fill="none" stroke="#D9D1BA" stroke-width="2">
    <rect x="70" y="316" width="100" height="64" rx="2"/>
    <rect x="184" y="316" width="100" height="64" rx="2"/>
    <rect x="298" y="316" width="176" height="28" rx="2"/>
    <rect x="298" y="352" width="176" height="28" rx="2"/>
    <rect x="488" y="316" width="100" height="64" rx="2"/>
    <rect x="602" y="316" width="128" height="64" rx="2"/>
  </g>
  <g fill="#C89B63">
    <circle cx="158" cy="348" r="3.4"/><circle cx="196" cy="348" r="3.4"/>
    <rect x="366" y="328" width="40" height="4" rx="2"/>
    <rect x="366" y="364" width="40" height="4" rx="2"/>
    <circle cx="576" cy="348" r="3.4"/><circle cx="614" cy="348" r="3.4"/>
  </g>
  <rect x="56" y="392" width="688" height="12" fill="#D9D1BA"/>

  <!-- island with oak top -->
  <rect x="196" y="352" width="408" height="16" rx="3" fill="#DFBE8C" stroke="#C6A171" stroke-width="2"/>
  <rect x="210" y="368" width="380" height="118" fill="#F9F5EA" stroke="#DCD4BD" stroke-width="2"/>
  <g fill="none" stroke="#DCD4BD" stroke-width="2">
    <rect x="226" y="382" width="104" height="90" rx="2"/>
    <rect x="348" y="382" width="104" height="90" rx="2"/>
    <rect x="470" y="382" width="104" height="90" rx="2"/>
  </g>
  <g fill="#C89B63"><circle cx="330" cy="428" r="3.4"/><circle cx="348" cy="428" r="3.4"/></g>

  <!-- stools -->
  <g stroke="#A9B9B3" stroke-width="4" stroke-linecap="round">
    <path d="M282 486v28M340 486v28M287 502h48"/>
    <path d="M462 486v28M520 486v28M467 502h48"/>
  </g>
  <rect x="272" y="476" width="78" height="12" rx="6" fill="#9EC4C0"/>
  <rect x="452" y="476" width="78" height="12" rx="6" fill="#9EC4C0"/>
</svg>

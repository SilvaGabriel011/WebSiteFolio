<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Moody luxe kitchen with dark green cabinetry, bookmatched veined stone and brass globe pendants">
  <defs>
    <linearGradient id="mbwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39463E"/><stop offset="1" stop-color="#28332C"/>
    </linearGradient>
    <linearGradient id="mbstone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F1"/><stop offset="1" stop-color="#E6E1D2"/>
    </linearGradient>
    <radialGradient id="mbglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F5DA95"/><stop offset="1" stop-color="#F5DA95" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mbplank" width="150" height="22" patternUnits="userSpaceOnUse">
      <rect width="150" height="22" fill="#4A3C2E"/>
      <path d="M0 10.6h150M0 21.4h150" stroke="#3A2E22" stroke-width="1.2"/>
      <path d="M46 0v10.6M112 11v11" stroke="#3A2E22" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="800" height="404" fill="url(#mbwall)"/>
  <rect y="404" width="800" height="116" fill="url(#mbplank)"/>
  <path d="M0 404h800" stroke="#1E1811" stroke-width="2"/>

  <!-- full-height dark cabinetry with brass shadowlines -->
  <rect x="48" y="44" width="704" height="152" fill="#24302A"/>
  <path d="M48 120h704" stroke="#C29349" stroke-width="1.6" opacity=".55"/>
  <path d="M224 44v152M400 44v152M576 44v152" stroke="#C29349" stroke-width="1.6" opacity=".55"/>
  <rect x="48" y="44" width="704" height="152" fill="none" stroke="#1A231E" stroke-width="3"/>

  <!-- under-cabinet glow strip -->
  <rect x="60" y="196" width="680" height="5" rx="2.5" fill="#EFC878"/>
  <rect x="48" y="201" width="704" height="26" fill="url(#mbglow)" opacity=".35"/>

  <!-- bookmatched stone splashback -->
  <rect x="48" y="204" width="704" height="86" fill="url(#mbstone)" stroke="#CBC4B0" stroke-width="2"/>
  <g fill="none" stroke-width="2.5">
    <path d="M400 214c-52 8-88 26-130 68M400 232c-38 6-66 22-96 58M400 214c52 8 88 26 130 68M400 232c38 6 66 22 96 58" stroke="#B9B29C"/>
    <path d="M400 208c-70 14-118 40-162 82M400 208c70 14 118 40 162 82" stroke="#C29349" opacity=".8"/>
    <path d="M120 216c30 18 44 44 48 72M680 216c-30 18-44 44-48 72" stroke="#C6BFA9"/>
  </g>
  <path d="M400 204v86" stroke="#CBC4B0" stroke-width="2"/>

  <!-- bench + brass tap -->
  <rect x="36" y="288" width="728" height="14" rx="2" fill="url(#mbstone)" stroke="#CBC4B0" stroke-width="2"/>
  <path d="M604 288v-26a14 14 0 0 1 14-14h9v8" fill="none" stroke="#C29349" stroke-width="5" stroke-linecap="round"/>

  <!-- dark base cabinetry -->
  <rect x="48" y="302" width="704" height="92" fill="#24302A"/>
  <path d="M224 302v92M400 302v92M576 302v92" stroke="#C29349" stroke-width="1.6" opacity=".55"/>
  <path d="M48 348h704" stroke="#C29349" stroke-width="1.6" opacity=".55"/>
  <rect x="48" y="394" width="704" height="10" fill="#C29349"/>

  <!-- brass globe pendants -->
  <g>
    <path d="M280 0v226M400 0v244M520 0v226" stroke="#8A6528" stroke-width="2.5"/>
    <circle cx="280" cy="248" r="24" fill="#C29349"/>
    <circle cx="400" cy="266" r="24" fill="#C29349"/>
    <circle cx="520" cy="248" r="24" fill="#C29349"/>
    <circle cx="273" cy="241" r="8" fill="#F0CF8C"/>
    <circle cx="393" cy="259" r="8" fill="#F0CF8C"/>
    <circle cx="513" cy="241" r="8" fill="#F0CF8C"/>
  </g>

  <!-- veined stone island -->
  <g>
    <rect x="180" y="330" width="440" height="18" rx="2" fill="url(#mbstone)" stroke="#CBC4B0" stroke-width="2.5"/>
    <rect x="180" y="330" width="18" height="162" fill="url(#mbstone)" stroke="#CBC4B0" stroke-width="2.5"/>
    <rect x="602" y="330" width="18" height="162" fill="url(#mbstone)" stroke="#CBC4B0" stroke-width="2.5"/>
    <rect x="198" y="348" width="404" height="144" fill="#F3EFE2"/>
    <g fill="none" stroke-width="2.5">
      <path d="M240 348c44 30 60 68 64 144M330 348c30 22 44 56 48 116" stroke="#BDB6A0"/>
      <path d="M420 348c50 26 72 66 76 144" stroke="#C29349" opacity=".8"/>
      <path d="M520 348c26 20 38 48 42 96" stroke="#C6BFA9"/>
    </g>
  </g>

  <!-- stools: brass frame, dark seat -->
  <g fill="none" stroke="#C29349" stroke-width="4" stroke-linecap="round">
    <path d="M282 500v16M348 500v16"/>
    <path d="M456 500v16M522 500v16"/>
  </g>
  <rect x="272" y="490" width="86" height="12" rx="6" fill="#1A231E" stroke="#C29349" stroke-width="2"/>
  <rect x="446" y="490" width="86" height="12" rx="6" fill="#1A231E" stroke="#C29349" stroke-width="2"/>
</svg>

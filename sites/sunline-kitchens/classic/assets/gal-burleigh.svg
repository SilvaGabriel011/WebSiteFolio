<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Compact apartment kitchen with sage floor-to-ceiling joinery, vertical tiles and a palm view window">
  <defs>
    <linearGradient id="bhwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#F1EBDB"/>
    </linearGradient>
    <pattern id="bhvert" width="28" height="64" patternUnits="userSpaceOnUse">
      <rect width="28" height="64" fill="#EFEDE2"/>
      <path d="M27.2 0v64" stroke="#D3CFBB" stroke-width="1.6"/>
      <path d="M0 63.2h28" stroke="#D3CFBB" stroke-width="1.6"/>
    </pattern>
    <pattern id="bhplank" width="150" height="22" patternUnits="userSpaceOnUse">
      <rect width="150" height="22" fill="#E8D8BC"/>
      <path d="M0 10.6h150M0 21.4h150" stroke="#D4C099" stroke-width="1.1"/>
      <path d="M40 0v10.6M112 11v11" stroke="#D4C099" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect width="800" height="410" fill="url(#bhwall)"/>
  <rect y="410" width="800" height="110" fill="url(#bhplank)"/>
  <path d="M0 410h800" stroke="#C4AC80" stroke-width="2"/>

  <!-- floor-to-ceiling sage joinery bank -->
  <rect x="48" y="40" width="230" height="370" fill="#86A489"/>
  <g fill="none" stroke="#63805F" stroke-width="2">
    <rect x="62" y="54" width="94" height="150" rx="2"/>
    <rect x="170" y="54" width="94" height="150" rx="2"/>
    <rect x="62" y="218" width="94" height="86" rx="2"/>
    <rect x="170" y="218" width="94" height="86" rx="2"/>
    <rect x="62" y="318" width="202" height="78" rx="2"/>
  </g>
  <g fill="#B58B3E">
    <rect x="150" y="120" width="4" height="44" rx="2"/>
    <rect x="172" y="120" width="4" height="44" rx="2"/>
    <rect x="150" y="248" width="4" height="30" rx="2"/>
    <rect x="172" y="248" width="4" height="30" rx="2"/>
    <rect x="140" y="352" width="46" height="4" rx="2"/>
  </g>

  <!-- palm window -->
  <rect x="330" y="56" width="150" height="150" rx="4" fill="#FDFBF4" stroke="#DAD2BB" stroke-width="3"/>
  <rect x="343" y="69" width="124" height="124" fill="#F4EEDA"/>
  <circle cx="378" cy="102" r="14" fill="#E9BE6A"/>
  <g fill="none" stroke="#5F7A63" stroke-width="4" stroke-linecap="round">
    <path d="M428 193v-52"/>
    <path d="M428 141c-12-12-26-14-38-10M428 141c12-12 26-14 38-10M428 137c-6-14-2-26 4-32M428 137c2-16 12-24 22-26"/>
  </g>

  <!-- open shelf + terracotta pots -->
  <path d="M330 238h150" stroke="#C9A96F" stroke-width="6" stroke-linecap="round"/>
  <path d="M348 238v-16a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v16z" fill="#C97B4F"/>
  <path d="M386 238v-12a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v12z" fill="#B58B3E"/>
  <path d="M446 238c-2-16 6-24 9-25 3 8 10 12 6 25z" fill="#7E9B7F"/>

  <!-- vertical-stack tile splashback -->
  <rect x="292" y="252" width="460" height="66" fill="url(#bhvert)" stroke="#D3CFBB" stroke-width="2"/>

  <!-- bench + cooktop + tap -->
  <rect x="284" y="316" width="476" height="13" rx="2" fill="#FFFFFF" stroke="#D6CEB7" stroke-width="2"/>
  <rect x="452" y="312" width="96" height="5" rx="2.5" fill="#3E4A56"/>
  <path d="M320 316v-22a12 12 0 0 1 12-12h8v8" fill="none" stroke="#B58B3E" stroke-width="4.5" stroke-linecap="round"/>

  <!-- base run -->
  <rect x="292" y="329" width="460" height="70" fill="#86A489"/>
  <g fill="none" stroke="#63805F" stroke-width="2">
    <rect x="306" y="340" width="120" height="48" rx="2"/>
    <rect x="440" y="340" width="120" height="48" rx="2"/>
    <rect x="574" y="340" width="164" height="20" rx="2"/>
    <rect x="574" y="368" width="164" height="20" rx="2"/>
  </g>
  <g fill="#B58B3E">
    <rect x="346" y="360" width="40" height="4" rx="2"/>
    <rect x="480" y="360" width="40" height="4" rx="2"/>
    <rect x="636" y="346" width="40" height="4" rx="2"/>
    <rect x="636" y="374" width="40" height="4" rx="2"/>
  </g>
  <rect x="292" y="399" width="460" height="11" fill="#5F7A63"/>

  <!-- breakfast-bar fold stool -->
  <g stroke="#8A6528" stroke-width="4" stroke-linecap="round">
    <path d="M600 452v50M662 452v50M606 478h50"/>
  </g>
  <rect x="590" y="442" width="82" height="12" rx="6" fill="#C97B4F"/>

  <!-- single pendant -->
  <path d="M470 0v218" stroke="#8A6528" stroke-width="2.5"/>
  <path d="M452 242c0-15 8-24 18-24s18 9 18 24z" fill="#C29349"/>
  <circle cx="470" cy="244" r="5" fill="#F5DA95"/>

  <!-- runner rug -->
  <rect x="316" y="470" width="220" height="26" rx="4" fill="#C97B4F" opacity=".85"/>
  <path d="M332 470v26M356 470v26M496 470v26M520 470v26" stroke="#E8D8BC" stroke-width="3"/>
</svg>

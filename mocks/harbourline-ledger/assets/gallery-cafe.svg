<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylised cafe counter with slatted timber front, pendant lights and shelving">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3C5F"/><stop offset="1" stop-color="#0F2438"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C96C"/><stop offset="1" stop-color="#A8861E"/>
    </linearGradient>
    <pattern id="slats" width="34" height="40" patternUnits="userSpaceOnUse">
      <rect width="34" height="40" fill="#16324F"/>
      <rect x="6" width="18" height="40" rx="3" fill="#C9A227" fill-opacity=".82"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E7C96C" stop-opacity=".55"/><stop offset="1" stop-color="#E7C96C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#C9A227" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- pendant lights -->
  <g>
    <line x1="250" y1="20" x2="250" y2="150" stroke="#F4EFE4" stroke-opacity=".6" stroke-width="3"/>
    <line x1="550" y1="20" x2="550" y2="150" stroke="#F4EFE4" stroke-opacity=".6" stroke-width="3"/>
    <circle cx="250" cy="196" r="72" fill="url(#glow)"/>
    <circle cx="550" cy="196" r="72" fill="url(#glow)"/>
    <path d="M222 150h56l-10 34h-36z" fill="#C9A227"/>
    <path d="M522 150h56l-10 34h-36z" fill="#C9A227"/>
    <circle cx="250" cy="194" r="7" fill="#E7C96C"/>
    <circle cx="550" cy="194" r="7" fill="#E7C96C"/>
  </g>

  <!-- wall shelf with cups -->
  <g>
    <rect x="580" y="256" width="180" height="10" rx="3" fill="url(#oak)"/>
    <rect x="580" y="336" width="180" height="10" rx="3" fill="url(#oak)"/>
    <g fill="#F4EFE4" fill-opacity=".85">
      <path d="M598 232h26v22a13 13 0 0 1-26 0z"/>
      <path d="M646 232h26v22a13 13 0 0 1-26 0z"/>
      <rect x="700" y="220" width="14" height="36" rx="4"/>
      <rect x="722" y="228" width="14" height="28" rx="4"/>
    </g>
    <g fill="#F4EFE4" fill-opacity=".65">
      <path d="M606 316h24v18a12 12 0 0 1-24 0z"/>
      <path d="M650 316h24v18a12 12 0 0 1-24 0z"/>
      <path d="M694 316h24v18a12 12 0 0 1-24 0z"/>
    </g>
  </g>

  <!-- counter -->
  <rect x="60" y="304" width="470" height="26" rx="4" fill="url(#oak)"/>
  <rect x="72" y="330" width="446" height="210" fill="url(#slats)"/>
  <rect x="72" y="330" width="446" height="210" fill="none" stroke="#F4EFE4" stroke-opacity=".4" stroke-width="3"/>

  <!-- espresso machine silhouette -->
  <g fill="#0E2236" stroke="#F4EFE4" stroke-opacity=".7" stroke-width="3">
    <rect x="120" y="238" width="150" height="66" rx="8"/>
    <rect x="146" y="276" width="26" height="28"/>
    <rect x="216" y="276" width="26" height="28"/>
  </g>
  <circle cx="252" cy="258" r="8" fill="#C9A227"/>

  <!-- stool -->
  <g stroke="#F4EFE4" stroke-opacity=".8" stroke-width="6" stroke-linecap="round">
    <line x1="606" y1="430" x2="592" y2="540"/>
    <line x1="666" y1="430" x2="680" y2="540"/>
    <line x1="612" y1="490" x2="660" y2="490"/>
  </g>
  <rect x="586" y="414" width="100" height="18" rx="8" fill="url(#oak)"/>

  <!-- floor -->
  <line x1="40" y1="540" x2="760" y2="540" stroke="#F4EFE4" stroke-opacity=".35" stroke-width="3"/>
</svg>

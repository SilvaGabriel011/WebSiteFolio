      <stop offset="0" stop-color="#FDFCF7"/><stop offset="1" stop-color="#EFE9DA"/>
    </linearGradient>
    <radialGradient id="bhsun" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#E9C87F"/><stop offset="1" stop-color="#C99F53"/>
    </radialGradient>
    <pattern id="bhtile" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#F8F2E4"/>
      <rect x="1.2" y="1.2" width="27.6" height="27.6" rx="1.5" fill="none" stroke="#E6DCC6" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="840" height="560" fill="#FBF8F1"/>
  <rect y="448" width="840" height="112" fill="#F0E7D2"/>

  <rect x="392" y="168" width="30" height="22" rx="3" fill="#B58B3E" opacity=".85"/>

  <rect x="240" y="206" width="250" height="96" fill="url(#bhtile)"/>
  <rect x="232" y="298" width="266" height="16" rx="3" fill="url(#bhstone)"/>
  <rect x="240" y="314" width="250" height="134" fill="#5F7A63"/>
